<style>
:root{
  /* Dark is the default. Accent hues are the Peerless brand hues lifted in
     lightness so they carry on a dark ground; the light theme below uses the
     brand values unaltered. */
  color-scheme:dark;
  --blue:#5ea3e0; --red:#e2796f; --navy:#03213f; --teal:#3fb6d8;
  --charcoal:#dde5ec; --gray:#6f7d8a;
  --page:#0e1620; --card:#16212c; --rule:#27333f; --muted:#94a3b1;
  --field:#101a24; --hdr:#03213f; --hdrfg:#eaf1f7; --hdrmeta:#7f9dba;
  --on-accent:#0b1219; --done-bg:#132019; --done-bd:#2c4a3a;
  --warn-bg:#2a1613;
  --body:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --narrow:"Arial Narrow","Helvetica Neue Condensed",Arial,sans-serif;
}
[data-theme="light"]{
  color-scheme:light;
  --blue:#0d4d8c; --red:#99251d; --navy:#03213f; --teal:#077fa3;
  --charcoal:#2f3033; --gray:#999999;
  --page:#f6f7f9; --card:#fff; --rule:#dfe3e8; --muted:#5c6470;
  --field:#fff; --hdr:#03213f; --hdrfg:#fff; --hdrmeta:#9fb6cc;
  --on-accent:#fff; --done-bg:#fbfdfb; --done-bd:#c9dcd2;
  --warn-bg:#fdf3f2;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--charcoal);font-family:var(--body);
  font-size:16px;line-height:1.5;
  padding-bottom:calc(6rem + env(safe-area-inset-bottom))}
a{color:var(--blue)}
.wrap{max-width:60rem;margin:0 auto}
header{background:var(--hdr);color:var(--hdrfg);padding:.9rem 1rem}
.hrow{display:flex;align-items:flex-start;gap:.75rem}
.hrow div{flex:1 1 auto;min-width:0}
#theme{flex:0 0 auto;font-family:var(--narrow);font-size:.75rem;letter-spacing:.09em;
  text-transform:uppercase;padding:.35rem .55rem;border:1px solid rgba(255,255,255,.35);
  border-radius:2px;background:transparent;color:var(--hdrfg);cursor:pointer}
header h1{font-size:1.1rem;margin:0;font-weight:600}
.meta{font-family:var(--narrow);font-size:.8rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--hdrmeta);margin-top:.25rem}
.lede{max-width:60rem;margin:0 auto;padding:.9rem 1rem .1rem;color:var(--muted);font-size:.93rem}

.controls{position:sticky;top:0;z-index:30;background:var(--page);
  border-bottom:1px solid var(--rule);padding:.55rem 1rem .5rem}
.row{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
#q{flex:1 1 11rem;min-width:0;padding:.5rem .65rem;font-size:1rem;font-family:var(--body);
  border:1px solid var(--rule);border-radius:3px;background:var(--field);color:var(--charcoal)}
#scope{flex:0 1 12rem;min-width:0;padding:.5rem .4rem;font-size:.9rem;font-family:var(--body);
  border:1px solid var(--rule);border-radius:3px;background:var(--field);color:var(--charcoal)}
input:focus,select:focus,button:focus-visible,textarea:focus{outline:2px solid var(--blue);outline-offset:1px}
.btn{font-family:var(--narrow);font-size:.8rem;letter-spacing:.07em;text-transform:uppercase;
  padding:.45rem .6rem;border:1px solid var(--rule);border-radius:2px;background:var(--card);
  color:var(--muted);cursor:pointer}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-accent);font-weight:600}
.btn[aria-pressed="true"]{background:var(--charcoal);border-color:var(--charcoal);color:var(--page)}
.bar{height:4px;background:var(--rule);border-radius:2px;margin-top:.5rem;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--teal)}
.status{font-family:var(--narrow);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);margin-top:.35rem}

main{max-width:60rem;margin:0 auto;padding:0 1rem}
h2.grp{font-family:var(--narrow);font-size:.85rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--blue);margin:1.5rem 0 .5rem;padding-bottom:.3rem;border-bottom:2px solid var(--blue);
  position:static;pointer-events:none}
h2.grp span{float:right;color:var(--gray);letter-spacing:.06em}

.item{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--gray);
  border-radius:3px;padding:.7rem .8rem;margin:.5rem 0;scroll-margin-top:9rem}
.item.UserStory{border-left-color:var(--blue)}
.item.Requirement{border-left-color:var(--teal)}
.item.DecisionRecord{border-left-color:var(--navy)}
.item.DesignNote{border-left-color:var(--gray)}
.item.OpenIssue{border-left-color:var(--red)}
.item.Persona{border-left-color:var(--charcoal)}
.item.Proposal{border-left-color:var(--red);border-left-width:5px}
.flag{display:block;margin:.4rem 0 0;padding:.35rem .5rem;border-radius:2px;
  background:rgba(94,163,224,.10);border-left:2px solid var(--blue);
  font-family:var(--narrow);font-size:.82rem;letter-spacing:.02em;color:var(--muted)}
.item.Proposal .flag{background:rgba(226,121,111,.10);border-left-color:var(--red)}
.pbody{margin:.45rem 0 0;font-size:.94rem}
#needs[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--on-accent)}
.item.done{background:var(--done-bg);border-color:var(--done-bd)}
.hd{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
.id{font-family:var(--narrow);font-size:.82rem;letter-spacing:.1em;font-weight:700;
  color:var(--navy);text-decoration:none}
.pri{font-family:var(--narrow);font-size:.7rem;letter-spacing:.1em;padding:.05rem .3rem;
  border:1px solid var(--rule);border-radius:2px;color:var(--muted)}
.pri.MUST{color:var(--red);border-color:var(--red)}
.pri.SHOULD{color:var(--teal);border-color:var(--teal)}
.ttl{font-weight:600;font-size:.97rem;flex:1 1 12rem}
.body{margin:.4rem 0 0;font-size:.94rem}
dl{margin:.55rem 0 0;font-size:.89rem}
dl div{display:grid;grid-template-columns:6.2rem 1fr;gap:.5rem;padding:.2rem 0;
  border-top:1px solid var(--rule)}
dt{font-family:var(--narrow);letter-spacing:.06em;text-transform:uppercase;font-size:.75rem;
  color:var(--muted);padding-top:.12rem}
dd{margin:0}
.xref{text-decoration:none;border-bottom:1px dotted var(--blue);font-family:var(--narrow);
  letter-spacing:.05em}

.review{margin-top:.65rem;padding-top:.55rem;border-top:1px solid var(--rule)}
.verdicts{display:flex;gap:.35rem;flex-wrap:wrap}
.v{flex:1 1 5rem;font-family:var(--narrow);font-size:.82rem;letter-spacing:.08em;
  text-transform:uppercase;padding:.5rem .4rem;border:1px solid var(--rule);border-radius:2px;
  background:var(--card);color:var(--muted);cursor:pointer;min-height:2.4rem}
.v[aria-pressed="true"]{color:var(--on-accent);font-weight:600}
.v[data-v="keep"][aria-pressed="true"]{background:var(--teal);border-color:var(--teal)}
.v[data-v="change"][aria-pressed="true"]{background:var(--blue);border-color:var(--blue)}
.v[data-v="strike"][aria-pressed="true"]{background:var(--red);border-color:var(--red)}
.fields{margin-top:.45rem}
.fields.hide{display:none}
label.fl{display:block;font-family:var(--narrow);font-size:.75rem;letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted);margin:.4rem 0 .15rem}
textarea{width:100%;font-family:var(--body);font-size:.93rem;padding:.45rem .55rem;
  border:1px solid var(--rule);border-radius:3px;background:var(--field);color:var(--charcoal);
  resize:vertical}
textarea.c{min-height:3.4rem}
textarea.p{min-height:4.6rem}
.toggle{margin-top:.4rem}
.empty{padding:2rem 0;color:var(--muted)}
#warn{display:none;background:var(--warn-bg);border:1px solid var(--red);border-left:3px solid var(--red);
  color:var(--red);font-size:.88rem;padding:.55rem .7rem;border-radius:3px;margin:.6rem 0 0}
#dumpwrap{display:none;margin-top:.8rem}
#dumpcap{font-family:var(--narrow);font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted)}
#dump{display:block;width:100%;min-height:14rem;margin-top:.6rem;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem}
@media (max-width:30rem){
  dl div{grid-template-columns:1fr;gap:.05rem}
  dt{padding-top:.2rem}
}
</style>
</head>

explorer does not hold a definition of maturity. it displays the figure the toolchain produces, or labels its own as an estimate. one definition of every figure rationale two independently computed figures for one artifact, both rendered as authoritative, is a defect in the toolchain rather than in either tool. status accepted affects r12.1 affects r5.6 affects r5.7"},{"id":"D3","cls":"DecisionRecord","group":"","text":"Anything the explorer cannot represent is reported. Silent omission is excluded.","anno":[["rationale","Repeated predicates, list-valued details and unrecognised classes are currently dropped without notice, so the reader cannot distinguish a sparse specification from an incompletely rendered one."],["status","accepted"],["affects","R2.10"],["affects","R2.6"],["affects","R2.7"],["affects","R2.9"]],"body":[],"resolved":false,"flag":"Proposed.","needs":true,"title":"Silence is excluded","priority":"","html":"Anything the explorer cannot represent is reported. Silent omission is excluded.","bodyHtml":[],"annoHtml":[["rationale","Repeated predicates, list-valued details and unrecognised classes are currently dropped without notice, so the reader cannot distinguish a sparse specification from an incompletely rendered one."],["status","accepted"],["affects","<a class=\"xref\" href=\"#i-R2.10\" data-id=\"R2.10\">R2.10</a>"],["affects","<a class=\"xref\" href=\"#i-R2.6\" data-id=\"R2.6\">R2.6</a>"],["affects","<a class=\"xref\" href=\"#i-R2.7\" data-id=\"R2.7\">R2.7</a>"],["affects","<a class=\"xref\" href=\"#i-R2.9\" data-id=\"R2.9\">R2.9</a>"]],"search":"d3 anything the explorer cannot represent is reported. silent omission is excluded. silence is excluded rationale repeated predicates, list-valued details and unrecognised classes are currently dropped without notice, so the reader cannot distinguish a sparse specification from an incompletely rendered one. status accepted affects r2.10 affects r2.6 affects r2.7 affects r2.9"},{"id":"D4","cls":"DecisionRecord","group":"","text":"Type and status are encoded through shape or text with colour as a secondary channel.","anno":[["rationale","The current dots carry no information in greyscale, in print, or for a reader who does not distinguish the hues, and the specification's existing requirement that the colours be themeable addresses the wrong half of the problem."],["status","accepted"],["affects","R3.6"],["affects","R4.3"]],"body":[],"resolved":false,"flag":"Proposed. It obsoletes R4.3 as written.","needs":true,"title":"Encoding is not colour alone","priority":"","html":"Type and status are encoded through shape or text with colour as a secondary channel.","bodyHtml":[],"annoHtml":[["rationale","The current dots carry no information in greyscale, in print, or for a reader who does not distinguish the hues, and the specification&#x27;s existing requirement that the colours be themeable addresses the wrong half of the problem."],["status","accepted"],["affects","<a class=\"xref\" href=\"#i-R3.6\" data-id=\"R3.6\">R3.6</a>"],["affects","<a class=\"xref\" href=\"#i-R4.3\" data-id=\"R4.3\">R4.3</a>"]],"search":"d4 type and status are encoded through shape or text with colour as a secondary channel. encoding is not colour alone rationale the current dots carry no information in greyscale, in print, or for a reader who does not distinguish the hues, and the specification's existing requirement that the colours be themeable addresses the wrong half of the problem. status accepted affects r3.6 affects r4.3"},{"id":"D5","cls":"DecisionRecord","group":"","text":"The explorer remains a single self-contained read-only file. Capabilities requiring evaluation, network access or a build step are supplied to it rather than implemented in it.","anno":[["rationale","Offline operation from removable media is a stated use case. Every capability added under this plan is either pure presentation of the loaded graph or the presentation of an artifact the CLI already produces."],["status","accepted"],["affects","R1.1"],["affects","R10.4"],["affects","R12.1"]],"body":[],"resolved":false,"flag":"Proposed. It is the rule that keeps later capabilities out of the single file.","needs":true,"title":"Single file, supplied inputs","priority":"","html":"The explorer remains a single self-contained read-only file. Capabilities requiring evaluation, network access or a build step are supplied to it rather than implemented in it.","bodyHtml":[],"annoHtml":[["rationale","Offline operation from removable media is a stated use case. Every capability added under this plan is either pure presentation of the loaded graph or the presentation of an artifact the CLI already produces."],["status","accepted"],["affects","<a class=\"xref\" href=\"#i-R1.1\" data-id=\"R1.1\">R1.1</a>"],["affects","<a class=\"xref\" href=\"#i-R10.4\" data-id=\"R10.4\">R10.4</a>"],["affects","<a class=\"xref\" href=\"#i-R12.1\" data-id=\"R12.1\">R12.1</a>"]],"search":"d5 the explorer remains a single self-contained read-only file. capabilities requiring evaluation, network access or a build step are supplied to it rather than implemented in it. single file, supplied inputs rationale offline operation from removable media is a stated use case. every capability added under this plan is either pure presentation of the loaded graph or the presentation of an artifact the cli already produces. status accepted affects r1.1 affects r10.4 affects r12.1"},{"id":"D6","cls":"DecisionRecord","group":"","text":"The syntax reference is generated from the toolchain rather than written alongside it.","anno":[["rationale","The annotation key set already drifted once inside the translator when it was held as two copies. A reference maintained by hand is a third copy, in a different repository artifact, with no test that would catch the divergence."],["status","accepted"],["affects","R13.1"],["affects","R13.2"]],"body":[],"resolved":false,"flag":"Proposed. It makes the syntax reference a build artifact rather than a document.","needs":true,"title":"The reference is generated","priority":"","html":"The syntax reference is generated from the toolchain rather than written alongside it.","bodyHtml":[],"annoHtml":[["rationale","The annotation key set already drifted once inside the translator when it was held as two copies. A reference maintained by hand is a third copy, in a different repository artifact, with no test that would catch the divergence."],["status","accepted"],["affects","<a class=\"xref\" href=\"#i-R13.1\" data-id=\"R13.1\">R13.1</a>"],["affects","<a class=\"xref\" href=\"#i-R13.2\" data-id=\"R13.2\">R13.2</a>"]],"search":"d6 the syntax reference is generated from the toolchain rather than written alongside it. the reference is generated rationale the annotation key set already drifted once inside the translator when it was held as two copies. a reference maintained by hand is a third copy, in a different repository artifact, with no test that would catch the divergence. status accepted affects r13.1 affects r13.2"},{"id":"D7","cls":"DecisionRecord","group":"","text":"The explorer generates specl source and does not interpret it.","anno":[["rationale","Interpreting markdown in the browser is a second implementation of the translator's grammar, which OQ2 was resolved against. Emitting it requires only the key tables the syntax reference already carries. The asymmetry is what makes composition affordable and round-trip editing not."],["status","accepted"],["affects","R13.5"],["affects","R13.6"]],"body":[],"resolved":false,"flag":"Proposed, and it is the decision that answers how far authoring goes.","needs":true,"title":"Emit, do not parse","priority":"","html":"The explorer generates specl source and does not interpret it.","bodyHtml":[],"annoHtml":[["rationale","Interpreting markdown in the browser is a second implementation of the translator&#x27;s grammar, which <a class=\"xref\" href=\"#i-OQ2\" data-id=\"OQ2\">OQ2</a> was resolved against. Emitting it requires only the key tables the syntax reference already carries. The asymmetry is what makes composition affordable and round-trip editing not."],["status","accepted"],["affects","<a class=\"xref\" href=\"#i-R13.5\" data-id=\"R13.5\">R13.5</a>"],["affects","<a class=\"xref\" href=\"#i-R13.6\" data-id=\"R13.6\">R13.6</a>"]],"search":"d7 the explorer generates specl source and does not interpret it. emit, do not parse rationale interpreting markdown in the browser is a second implementation of the translator's grammar, which oq2 was resolved against. emitting it requires only the key tables the syntax reference already carries. the asymmetry is what makes composition affordable and round-trip editing not. status accepted affects r13.5 affects r13.6"},{"id":"DN1","cls":"DesignNote","group":"","text":"The Turtle parser does not need to be RFC-compliant. It only needs to handle the output of `specl.spec_to_rdf`, which is deterministic and well-formed. A 30-line parser is sufficient.","anno":[],"body":[],"resolved":false,"flag":"","needs":false,"title":"The Turtle parser does not need to be RFC-compliant","priority":"","html":"The Turtle parser does not need to be RFC-compliant. It only needs to handle the output of `specl.spec_to_rdf`, which is deterministic and well-formed. A 30-line parser is sufficient.","bodyHtml":[],"annoHtml":[],"search":"dn1 the turtle parser does not need to be rfc-compliant. it only needs to handle the output of `specl.spec_to_rdf`, which is deterministic and well-formed. a 30-line parser is sufficient. the turtle parser does not need to be rfc-compliant"},{"id":"DN2","cls":"DesignNote","group":"","text":"Prefer declarative CSS over runtime style manipulation. Use CSS classes and variables; avoid setting styles via JavaScript except for the maturity bar width and color.","anno":[],"body":[],"resolved":false,"flag":"","needs":false,"title":"Prefer declarative CSS over runtime style manipulation","priority":"","html":"Prefer declarative CSS over runtime style manipulation. Use CSS classes and variables; avoid setting styles via JavaScript except for the maturity bar width and color.","bodyHtml":[],"annoHtml":[],"search":"dn2 prefer declarative css over runtime style manipulation. use css classes and variables; avoid setting styles via javascript except for the maturity bar width and color. prefer declarative css over runtime style manipulation"},{"id":"DN3","cls":"DesignNote","group":"","text":"Keep the JavaScript in a single `<script>` block at the bottom of the file. No modules, no imports, no bundler.","anno":[],"body":[],"resolved":false,"flag":"","needs":false,"title":"Keep the JavaScript in a single `<script>` block at the bottom of the file","priority":"","html":"Keep the JavaScript in a single `&lt;script&gt;` block at the bottom of the file. No modules, no imports, no bundler.","bodyHtml":[],"annoHtml":[],"search":"dn3 keep the javascript in a single `<script>` block at the bottom of the file. no modules, no imports, no bundler. keep the javascript in a single `<script>` block at the bottom of the file"},{"id":"DN4","cls":"DesignNote","group":"","text":"Treat the explorer as read-only. Editing, saving, or uploading is explicitly out of scope for v1.","anno":[],"body":[],"resolved":false,"flag":"","needs":false,"title":"Treat the explorer as read-only","priority":"","html":"Treat the explorer as read-only. Editing, saving, or uploading is explicitly out of scope for v1.","bodyHtml":[],"annoHtml":[],"search":"dn4 treat the explorer as read-only. editing, saving, or uploading is explicitly out of scope for v1. treat the explorer as read-only"},{"id":"DN5","cls":"DesignNote","group":"","text":"The existing broken `explorer.html` placeholder in the package should be replaced wholesale, not patched.","anno":[],"body":[],"resolved":false,"flag":"","needs":false,"title":"The existing broken `explorer.html` placeholder in the package should be\u2026","priority":"","html":"The existing broken `explorer.html` placeholder in the package should be replaced wholesale, not patched.","bodyHtml":[],"annoHtml":[],"search":"dn5 the existing broken `explorer.html` placeholder in the package should be replaced wholesale, not patched. the existing broken `explorer.html` placeholder in the package should be\u2026"},{"id":"DN6","cls":"DesignNote","group":"","text":"Acceptance criteria in this specification state what must be obtainable rather than what must be on screen. Where a criterion says a value is reported or returned on request, an implementation satisfies it by making the value reachable; where a criterion requires something to be visible without being asked for, it says so.","anno":[],"body":[],"resolved":false,"flag":"","needs":false,"title":"Acceptance criteria in this specification state what must be obtainable rather\u2026","priority":"","html":"Acceptance criteria in this specification state what must be obtainable rather than what must be on screen. Where a criterion says a value is reported or returned on request, an implementation satisfies it by making the value reachable; where a criterion requires something to be visible without being asked for, it says so.","bodyHtml":[],"annoHtml":[],"search":"dn6 acceptance criteria in this specification state what must be obtainable rather than what must be on screen. where a criterion says a value is reported or returned on request, an implementation satisfies it by making the value reachable; where a criterion requires something to be visible without being asked for, it says so. acceptance criteria in this specification state what must be obtainable rather\u2026"},{"id":"DN7","cls":"DesignNote","group":"","text":"Several capabilities depend on one structure: an index from IRI to item, built once at parse time. Reference navigation (R6.6), backlinks (R6.7), finding attribution (R12.2) and unresolved-reference marking all read from it. Building it as a distinct step rather than as a side effect of rendering is what keeps those capabilities from each carrying their own resolution logic.","anno":[],"body":[],"resolved":false,"flag":"","needs":false,"title":"Several capabilities depend on one structure: an index from IRI to item, built\u2026","priority":"","html":"Several capabilities depend on one structure: an index from IRI to item, built once at parse time. Reference navigation (<a class=\"xref\" href=\"#i-R6.6\" data-id=\"R6.6\">R6.6</a>), backlinks (<a class=\"xref\" href=\"#i-R6.7\" data-id=\"R6.7\">R6.7</a>), finding attribution (<a class=\"xref\" href=\"#i-R12.2\" data-id=\"R12.2\">R12.2</a>) and unresolved-reference marking all read from it. Building it as a distinct step rather than as a side effect of rendering is what keeps those capabilities from each carrying their own resolution logic.","bodyHtml":[],"annoHtml":[],"search":"dn7 several capabilities depend on one structure: an index from iri to item, built once at parse time. reference navigation (r6.6), backlinks (r6.7), finding attribution (r12.2) and unresolved-reference marking all read from it. building it as a distinct step rather than as a side effect of rendering is what keeps those capabilities from each carrying their own resolution logic. several capabilities depend on one structure: an index from iri to item, built\u2026"},{"id":"DN8","cls":"DesignNote","group":"","text":"The explorer and specl-validate must not disagree about a number. Where the CLI computes a figure, the explorer displays that figure or states that it is estimating. Where the CLI computes nothing, the explorer's figure carries its own definition. This is the same obligation the format places on a specification: a number whose derivation is not recoverable is not evidence.","anno":[],"body":[],"resolved":false,"flag":"","needs":false,"title":"The explorer and specl-validate must not disagree about a number","priority":"","html":"The explorer and specl-validate must not disagree about a number. Where the CLI computes a figure, the explorer displays that figure or states that it is estimating. Where the CLI computes nothing, the explorer&#x27;s figure carries its own definition. This is the same obligation the format places on a specification: a number whose derivation is not recoverable is not evidence.","bodyHtml":[],"annoHtml":[],"search":"dn8 the explorer and specl-validate must not disagree about a number. where the cli computes a figure, the explorer displays that figure or states that it is estimating. where the cli computes nothing, the explorer's figure carries its own definition. this is the same obligation the format places on a specification: a number whose derivation is not recoverable is not evidence. the explorer and specl-validate must not disagree about a number"},{"id":"DN9","cls":"DesignNote","group":"","text":"The ODT Operational Console specification is the reference for authoring style in this specification: priority and acceptance on every requirement, rationale where a requirement encodes a judgement, decisions recorded with what they affect, and open questions that record their disposition when they close.","anno":[],"body":[],"resolved":false,"flag":"","needs":false,"title":"The ODT Operational Console specification is the reference for authoring style\u2026","priority":"","html":"The ODT Operational Console specification is the reference for authoring style in this specification: priority and acceptance on every requirement, rationale where a requirement encodes a judgement, decisions recorded with what they affect, and open questions that record their disposition when they close.","bodyHtml":[],"annoHtml":[],"search":"dn9 the odt operational console specification is the reference for authoring style in this specification: priority and acceptance on every requirement, rationale where a requirement encodes a judgement, decisions recorded with what they affect, and open questions that record their disposition when they close. the odt operational console specification is the reference for authoring style\u2026"},{"id":"OQ1","cls":"OpenIssue","group":"","text":"Whether to support slash namespaces (`/`) as an alternative to the current hash namespaces (`#`) for spec instances. Hash namespaces resolve all terms to a single document and are the right default for specs authored as a unit. Slash namespaces (as used by Schema.org, where `https://schema.org/Person` returns a dedicated page) would let specs host each requirement, story, or decision at its own dereferenceable URL. This matters for large, multi-team specs where individual elements need independent linking, versioning, or API-driven resolution.","anno":[["recommendation","support a `namespace_style: hash | slash` front-matter key in a future release; default to `hash`; document the tradeoffs in SYNTAX.md"],["status","open"]],"body":[],"resolved":false,"flag":"","needs":false,"title":"Whether to support slash namespaces (`/`) as an alternative to the current hash\u2026","priority":"","html":"Whether to support slash namespaces (`/`) as an alternative to the current hash namespaces (`#`) for spec instances. Hash namespaces resolve all terms to a single document and are the right default for specs authored as a unit. Slash namespaces (as used by Schema.org, where `https://schema.org/Person` returns a dedicated page) would let specs host each requirement, story, or decision at its own dereferenceable URL. This matters for large, multi-team specs where individual elements need independent linking, versioning, or API-driven resolution.","bodyHtml":[],"annoHtml":[["recommendation","support a `namespace_style: hash | slash` front-matter key in a future release; default to `hash`; document the tradeoffs in SYNTAX.md"],["status","open"]],"search":"oq1 whether to support slash namespaces (`/`) as an alternative to the current hash namespaces (`#`) for spec instances. hash namespaces resolve all terms to a single document and are the right default for specs authored as a unit. slash namespaces (as used by schema.org, where `https://schema.org/person` returns a dedicated page) would let specs host each requirement, story, or decision at its own dereferenceable url. this matters for large, multi-team specs where individual elements need independent linking, versioning, or api-driven resolution. whether to support slash namespaces (`/`) as an alternative to the current hash\u2026 recommendation support a `namespace_style: hash | slash` front-matter key in a future release; default to `hash`; document the tradeoffs in syntax.md status open"},{"id":"OQ2","cls":"OpenIssue","group":"","text":"Whether to support loading the companion `spec.md` alongside the `.ttl` for side-by-side reading.","anno":[["recommendation","Resolved as no. A markdown parser in the explorer would be a second implementation of the translator and would diverge from it. The need it addresses is met instead by carrying prov:wasDerivedFrom and specl:sourceLine into the detail view (R6.8), and by a CLI command that inlines the Turtle into a copy of the explorer."],["status","resolved"]],"body":[],"resolved":false,"flag":"Dispositioned as no. Verdict wanted on the disposition, not on the question.","needs":true,"title":"Whether to support loading the companion `spec.md` alongside the `.ttl` for\u2026","priority":"","html":"Whether to support loading the companion `spec.md` alongside the `.ttl` for side-by-side reading.","bodyHtml":[],"annoHtml":[["recommendation","Resolved as no. A markdown parser in the explorer would be a second implementation of the translator and would diverge from it. The need it addresses is met instead by carrying prov:wasDerivedFrom and specl:sourceLine into the detail view (<a class=\"xref\" href=\"#i-R6.8\" data-id=\"R6.8\">R6.8</a>), and by a CLI command that inlines the Turtle into a copy of the explorer."],["status","resolved"]],"search":"oq2 whether to support loading the companion `spec.md` alongside the `.ttl` for side-by-side reading. whether to support loading the companion `spec.md` alongside the `.ttl` for\u2026 recommendation resolved as no. a markdown parser in the explorer would be a second implementation of the translator and would diverge from it. the need it addresses is met instead by carrying prov:wasderivedfrom and specl:sourceline into the detail view (r6.8), and by a cli command that inlines the turtle into a copy of the explorer. status resolved"},{"id":"OQ3","cls":"OpenIssue","group":"","text":"Whether to render Mermaid diagrams embedded in description strings.","anno":[["recommendation","defer; out of scope for a read-only viewer"],["status","open"]],"body":[],"resolved":false,"flag":"","needs":false,"title":"Whether to render Mermaid diagrams embedded in description strings","priority":"","html":"Whether to render Mermaid diagrams embedded in description strings.","bodyHtml":[],"annoHtml":[["recommendation","defer; out of scope for a read-only viewer"],["status","open"]],"search":"oq3 whether to render mermaid diagrams embedded in description strings. whether to render mermaid diagrams embedded in description strings recommendation defer; out of scope for a read-only viewer status open"},{"id":"OQ4","cls":"OpenIssue","group":"","text":"Whether to show SHACL validation results inline by also loading a `shapes.ttl`.","anno":[["recommendation","Resolved as yes, with the mechanism inverted. Shapes are not evaluated in the browser. The explorer consumes the JSON report specl-validate already emits, keyed by focus node. Specified as R12.1 and R12.2."],["status","resolved"]],"body":[],"resolved":false,"flag":"Dispositioned as yes with the mechanism inverted.","needs":true,"title":"Whether to show SHACL validation results inline by also loading a `shapes.ttl`","priority":"","html":"Whether to show SHACL validation results inline by also loading a `shapes.ttl`.","bodyHtml":[],"annoHtml":[["recommendation","Resolved as yes, with the mechanism inverted. Shapes are not evaluated in the browser. The explorer consumes the JSON report sp   const el = document.getElementById('warn');

  el.style.display = 'block';
}

const scopeSel = document.getElementById('scope');
scopeSel.innerHTML = ['<option value="all">Whole specification</option>']
  .concat(DATA.groups.map(g => `<option value="g:${esc(g)}">${esc(g)}</option>`))
  .concat(DATA.order.map(c => `<option value="c:${c}">${DATA.labels[c]}</option>`)).join('');

function esc(s){ return String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }
function inScope(i){
  if(scope === 'all') return true;
  if(scope.startsWith('g:')) return i.group === scope.slice(2);
  return i.cls === scope.slice(2);
}
function answered(i){ const r = review[i.id]; return !!(r && r.verdict) }
function touched(i){ const r = review[i.id]; return !!(r && (r.verdict || r.comment || r.proposed)) }

function card(i){
  const r = review[i.id] || {};
  const rows = i.annoHtml.filter(a => a[0] !== 'priority')
    .map(([k,v]) => `<div><dt>${esc(k)}</dt><dd>${v}</dd></div>`).join('');
  const showFields = !!(r.comment || r.proposed || r.verdict === 'change' || r.verdict === 'strike');
  return `<article class="item ${i.cls}${answered(i)?' done':''}" id="i-${i.id}" data-id="${i.id}">
    <div class="hd">
      <a class="id" href="#i-${i.id}">${i.id}</a>
      ${i.priority ? `<span class="pri ${i.priority}">${i.priority}</span>` : ''}
      <span class="ttl">${esc(i.title)}</span>
    </div>
    ${i.flag ? `<span class="flag">${esc(i.flag)}</span>` : ''}
    <p class="body">${i.html}</p>
    ${i.bodyHtml.map(b => `<p class="pbody">${b}</p>`).join('')}
    ${rows ? `<dl>${rows}</dl>` : ''}
    <div class="review">
      <div class="verdicts">
        ${['keep','change','strike'].map(v =>
          `<button class="v" data-v="${v}" aria-pressed="${r.verdict===v}">${v}</button>`).join('')}
      </div>
      <button class="btn toggle" data-toggle="1">${showFields ? 'Hide notes' : 'Add a note'}</button>
      <div class="fields${showFields ? '' : ' hide'}">
        <label class="fl" for="c-${i.id}">Comment</label>
        <textarea class="c" id="c-${i.id}" data-f="comment" placeholder="Why, or what is wrong with it">${esc(r.comment||'')}</textarea>
        <label class="fl" for="p-${i.id}">Replacement text</label>
        <textarea class="p" id="p-${i.id}" data-f="proposed" placeholder="Wording to use instead, if you have it">${esc(r.proposed||'')}</textarea>
      </div>
    </div>
  </article>`;
}

function selected(){
  return DATA.items.filter(i => inScope(i)
    && (!q || i.search.includes(q))
    && (!onlyNeeds || i.needs)
    && (!onlyOpen || !answered(i)));
}

function progress(){
  const pool = DATA.items.filter(i => inScope(i) && (!onlyNeeds || i.needs));
  const done = pool.filter(answered).length;
  document.getElementById('barfill').style.width =
    (pool.length ? Math.round(done / pool.length * 100) : 0) + '%';
  document.getElementById('status').textContent =
    `${done} of ${pool.length} reviewed`
    + (onlyNeeds ? '  \u00b7  needs review only' : '')
    + (onlyOpen ? '  \u00b7  unreviewed only' : '')
    + (q ? '  \u00b7  filtered' : '');
  return {done, total: pool.length};
}

function render(){
  const sel = selected();
  const out = [];
  let head = null;
  for(const i of sel){
    const h = i.group || DATA.labels[i.cls];
    if(h !== head){
      head = h;
      const n = sel.filter(x => (x.group || DATA.labels[x.cls]) === h).length;
      out.push(`<h2 class="grp">${esc(h)}<span>${n}</span></h2>`);
    }
    out.push(card(i));
  }
  document.getElementById('out').innerHTML = out.length ? out.join('')
    : '<p class="empty">Nothing matches. Clear the filter, widen the scope, or turn off Unreviewed.</p>';
  progress();
}

document.getElementById('q').addEventListener('input', e => { q = e.target.value.toLowerCase().trim(); render() });
scopeSel.addEventListener('change', e => { scope = e.target.value; render() });
const needsBtn = document.getElementById('needs');
needsBtn.textContent = 'Needs review (' + DATA.items.filter(i => i.needs).length + ')';
needsBtn.addEventListener('click', e => {
  onlyNeeds = !onlyNeeds; e.currentTarget.setAttribute('aria-pressed', onlyNeeds); render();
});
document.getElementById('openonly').addEventListener('click', e => {
  onlyOpen = !onlyOpen; e.currentTarget.setAttribute('aria-pressed', onlyOpen); render();
});

const out = document.getElementById('out');
out.addEventListener('click', e => {
  const v = e.target.closest('.v');
  if(v){
    const art = v.closest('.item'), id = art.dataset.id;
    const r = review[id] || (review[id] = {});
    r.verdict = (r.verdict === v.dataset.v) ? '' : v.dataset.v;
    if(!r.verdict) delete r.verdict;
    art.querySelectorAll('.v').forEach(b =>
      b.setAttribute('aria-pressed', b.dataset.v === r.verdict));
    art.classList.toggle('done', !!r.verdict);
    if(r.verdict === 'change' || r.verdict === 'strike'){
      art.querySelector('.fields').classList.remove('hide');
      art.querySelector('[data-toggle]').textContent = 'Hide notes';
    }
    save(); progress();
    return;
  }
  const t = e.target.closest('[data-toggle]');
  if(t){
    const f = t.closest('.review').querySelector('.fields');
    f.classList.toggle('hide');
    t.textContent = f.classList.contains('hide') ? 'Add a note' : 'Hide notes';
    return;
  }
  const a = e.target.closest('.xref');
  if(a && !document.getElementById('i-' + a.dataset.id)){
    e.preventDefault();
    scope = 'all'; scopeSel.value = 'all';
    q = ''; document.getElementById('q').value = '';
    onlyOpen = false; document.getElementById('openonly').setAttribute('aria-pressed', false);
    onlyNeeds = false; needsBtn.setAttribute('aria-pressed', false);
    render();
    const el = document.getElementById('i-' + a.dataset.id);
    if(el) el.scrollIntoView({block:'start'});
  }
});
out.addEventListener('input', e => {
  const ta = e.target.closest('textarea[data-f]');
  if(!ta) return;
  const id = ta.closest('.item').dataset.id;
  const r = review[id] || (review[id] = {});
  const val = ta.value.trim();
  if(val) r[ta.dataset.f] = ta.value; else delete r[ta.dataset.f];
  if(!Object.keys(r).length) delete review[id];
  save();
});

function payload(){
  const items = {}, proposals = {};
  for(const i of DATA.items){
    const r = review[i.id];
    if(r && (r.verdict || r.comment || r.proposed)){
      const entry = Object.assign({}, r);
      if(!inScope(i)) entry.out_of_scope = true;
      (i.cls === 'Proposal' ? proposals : items)[i.id] = entry;
    }
  }
  const p = progress();
  return {
    spec: DATA.title, version: DATA.version,
    scope: scope === 'all' ? 'whole specification' : scope.slice(2),
    exported: new Date().toISOString(),
    filter: onlyNeeds ? 'needs review only' : 'all items',
    answered: p.done, total: p.total,
    items, proposals
  };
}

document.getElementById('export').addEventListener('click', () => {
  const p = payload();
  if(p.answered < p.total){
    const miss = p.total - p.answered;
    const ok = confirm(`${miss} of ${p.total} items in this scope have no verdict. `
      + `Export anyway?\n\nCancel to see just the unreviewed ones.`);
    if(!ok){
      onlyOpen = true;
      document.getElementById('openonly').setAttribute('aria-pressed', true);
      render();
      window.scrollTo({top:0});
      return;
    }
  }
  const text = JSON.stringify(p, null, 1);
  const name = 'explorer-review-r1-' + p.exported.slice(0,10) + '.json';
  let ok = false;
  try{
    const url = URL.createObjectURL(new Blob([text], {type:'application/json'}));
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000); ok = true;
  }catch(e){}
  const dump = document.getElementById('dump');
  dump.value = text;
  document.getElementById('dumpwrap').style.display = 'block';
  if(!ok){ dump.scrollIntoView({block:'center'}); dump.select(); }
});

const themeBtn = document.getElementById('theme');
function paintTheme(){
  const light = document.documentElement.getAttribute('data-theme') === 'light';
  themeBtn.textContent = light ? 'Dark' : 'Light';
  themeBtn.setAttribute('aria-pressed', light);
  themeBtn.setAttribute('aria-label', light ? 'Switch to dark theme' : 'Switch to light theme');
}
themeBtn.addEventListener('click', () => {
  const light = document.documentElement.getAttribute('data-theme') === 'light';
  if(light) document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme','light');
  try{ localStorage.setItem('explorer-review-r1-theme', light ? 'dark' : 'light'); }catch(e){}
  paintTheme();
});
paintTheme();

document.getElementById('import').addEventListener('click', () => document.getElementById('file').click());
document.getElementById('file').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const j = JSON.parse(rd.result);
      const incoming = Object.assign({}, j.items || j, j.proposals || {});
      let n = 0;
      for(const k in incoming){ review[k] = incoming[k]; n++ }
      save(); render();
      alert(`Loaded ${n} responses.`);
    }catch(err){ alert('That file is not a review export. Nothing was loaded.') }
  };
  rd.readAsText(f);
  e.target.value = '';
});

if(!storageOk) flagStorage();
render();
if(location.hash){ const el = document.getElementById(location.hash.slice(1)); if(el) el.scrollIntoView({block:'start'}) }
</script>
</body>
</html>
