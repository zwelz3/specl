the Turtle, and must not implement shape evaluation of its own.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"322\"^^xsd:integer ;\n    specl:priority \"SHOULD\" ;\n    specl:acceptanceCriterion \"Given a validation report loaded alongside a specification, when it is present, then findings are attributed to items by focus node; and given no report, when the interface is rendered, then findings are reported as unavailable rather than as absent.\" ;\n    specl:rationale \"The validator already emits severity, focus node, path and message as JSON keyed by IRI. Reimplementing SHACL in the browser would produce a second definition of conformance, which is the failure R5.6 exists to prevent.\" .\n\nspec:R12.2 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"An item carrying findings must indicate this in the item list, and must present…\" ;\n    dct:description \"An item carrying findings must indicate this in the item list, and must present its findings in its detail view.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"327\"^^xsd:integer ;\n    specl:priority \"SHOULD\" ;\n    specl:acceptanceCriterion \"Given an item with one or more findings, when the list is rendered, then the item is marked, and when its detail view is opened, then each finding's severity, path and message are shown.\" ;\n    specl:rationale \"This is the change that moves the tool from displaying what an author wrote to showing what remains to be fixed, which is the reason a reader opens it a second time.\" .\n\nspec:R13.1 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The explorer must carry a reference to the specl source syntax, reachable from…\" ;\n    dct:description \"The explorer must carry a reference to the specl source syntax, reachable from any selection, covering the recognised section headings and the item class each produces, the annotation keys and the property each maps to, which keys take a reference rather than a literal, the recognised front-matter keys, and the markers that park or exempt a section.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"334\"^^xsd:integer ;\n    specl:priority \"MUST\" ;\n    specl:acceptanceCriterion \"Given any selection, when the reference is opened, then the sections, classes, annotation keys, reference-valued keys, front-matter keys and section markers the translator recognises are all listed.\" ;\n    specl:rationale \"The reader most likely to be looking the syntax up is the author who is at that moment looking at what their specification is missing. Requiring them to leave for a separate document to find the key that fixes it is the point at which the correction does not get made.\" .\n\nspec:R13.2 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The reference must be generated from the translator's own tables and the…\" ;\n    dct:description \"The reference must be generated from the translator's own tables and the bundled shapes when the explorer is built, and must state the specl version and graph contract it was generated from.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"339\"^^xsd:integer ;\n    specl:priority \"MUST\" ;\n    specl:acceptanceCriterion \"Given the built explorer, when the reference is inspected, then every annotation key the translator accepts is present, no key the translator does not accept is present, and the version and contract the reference was generated from are stated.\" ;\n    specl:rationale \"The translator's own source records that this key set was once held as two hardcoded copies, and that adding a key to one and not the other made a valid annotation parse as unknown. A hand-maintained reference is a third copy of the same set, with the same failure and a slower path to discovering it.\" .\n\nspec:R13.3 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Where an item is selected, the reference must indicate which annotation keys…\" ;\n    dct:description \"Where an item is selected, the reference must indicate which annotation keys the item's class accepts and which of those the item does not carry.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"344\"^^xsd:integer ;\n    specl:priority \"SHOULD\" ;\n    specl:acceptanceCriterion \"Given a selected item, when the reference is opened, then the keys its class accepts are distinguished from the rest, and those absent from the item are marked.\" ;\n    specl:rationale \"This is the same information the detail view already renders as \\\"not set\\\" placeholders, expressed as the syntax needed to fill them. Connecting the two makes the reference part of the correction rather than a document beside it.\" .\n\nspec:R13.4 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The reference must be held in the single file and must not require a network…\" ;\n    dct:description \"The reference must be held in the single file and must not require a network request or a second document.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"349\"^^xsd:integer ;\n    specl:priority \"MUST\" ;\n    specl:acceptanceCriterion \"Given a machine with no network access, when the reference is opened, then it renders in full.\" .\n\nspec:R13.5 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The explorer may generate specl source\" ;\n    dct:description \"The explorer may generate specl source. It must not interpret it.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"353\"^^xsd:integer ;\n    specl:priority \"MUST\" ;\n    specl:acceptanceCriterion \"Given the explorer's implementation, when it is inventoried, then it contains no parser for specl markdown, and any source it produces is offered to the user rather than loaded back into the graph it holds.\" ;\n    specl:rationale \"A markdown parser in the browser is a second implementation of the translator's grammar and will diverge from it, which is the reason OQ2 was resolved as it was. Emitting source requires only the key tables the reference already carries, so the two directions have different costs and are governed separately.\" .\n\nspec:R13.6 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Withdrawn\" ;\n    dct:description \"Withdrawn. Composition was built and removed: markdown emitted by a viewer that cannot translate, validate or score it puts the author in front of text nothing has checked, which costs more attention than it saves. R13.5 continues to govern anything that would emit source later.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"358\"^^xsd:integer ;\n    specl:itemStatus \"withdrawn\" ;\n    specl:priority \"WONT\" ;\n    specl:acceptanceCriterion \"Given the implementation, when it is inventoried, then it contains nothing that emits specl source.\" .\n\nspec:US1 a specl:UserStory ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"As a specification author, I open the explorer, drop my spec.ttl, and…\" ;\n    dct:description \"As a specification author, I open the explorer, drop my spec.ttl, and immediately see which requirements are missing acceptance criteria so I know where to focus.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"382\"^^xsd:integer ;\n    specl:role spec:P1 ;\n    specl:capability \"Per-item reporting of absent properties, aggregated into a figure that opens the items producing it\" ;\n    specl:benefit \"Revision effort is directed by what the specification is missing rather than by rereading it\" ;\n    specl:acceptanceCriterion \"Given a loaded specification, when the maturity figure is opened, then the items reducing it are listed with the property each is missing.\" ;\n    specl:priority \"MUST\" .\n\nspec:US2 a specl:UserStory ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"As a reviewer, I filter the sidebar by a keyword to find all requirements…\" ;\n    dct:description \"As a reviewer, I filter the sidebar by a keyword to find all requirements touching one subject, click through each one, and read their full detail without opening the markdown file.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"389\"^^xsd:integer ;\n    specl:role spec:P2 ;\n    specl:capability \"Text filtering across identifier, title and description, with full item detail on selection\" ;\n    specl:benefit \"A specification can be reviewed without the source or a toolchain\" ;\n    specl:acceptanceCriterion \"Given a filter term, when it is entered, then every item whose identifier, title or description contains it is listed, and when one is selected, then every property it carries is shown.\" ;\n    specl:priority \"MUST\" .\n\nspec:US3 a specl:UserStory ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"As a downstream integrator, I open the explorer to verify that the emitted…\" ;\n    dct:description \"As a downstream integrator, I open the explorer to verify that the emitted Turtle matches what I expect before feeding it to another tool.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"396\"^^xsd:integer ;\n    specl:role spec:P3 ;\n    specl:capability \"Raw serialisation for any item and for the whole file, alongside the rendered presentation of the same content\" ;\n    specl:benefit \"The presentation layer is checkable against the graph rather than trusted\" ;\n    specl:acceptanceCriterion \"Given a selected item, when its raw statement block is displayed, then it contains every property the detail view rendered and any derived nodes the item owns.\" ;\n    specl:priority \"MUST\" .\n\nspec:US4 a specl:UserStory ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"As a programme lead, I read the maturity figure to gauge how close a…\" ;\n    dct:description \"As a programme lead, I read the maturity figure to gauge how close a specification is to production-ready without asking its author.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"403\"^^xsd:integer ;\n    specl:role spec:P4 ;\n    specl:capability \"A single reported figure with its definition and its contributors reachable from where it appears\" ;\n    specl:benefit \"A judgement about a specification's state is formed from a stated definition rather than an impression\" ;\n    specl:acceptanceCriterion \"Given the maturity figure, when its definition is requested, then what is counted, over what population, and with what exclusions is returned.\" ;\n    specl:priority \"MUST\" .\n\nspec:US5 a specl:UserStory ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"As an attesting reader with no development tools installed, I open the explorer…\" ;\n    dct:description \"As an attesting reader with no development tools installed, I open the explorer from removable media and read the specification in full.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"410\"^^xsd:integer ;\n    specl:role spec:P5 ;\n    specl:capability \"Complete offline operation from a single file, with every item and the whole source reachable\" ;\n    specl:benefit \"A specification can be read and attested to in an environment that permits no installation\" ;\n    specl:acceptanceCriterion \"Given a machine with no network access and no specl installation, when the file is opened from removable media, then every item in the loaded specification is reachable and the raw source is displayable.\" ;\n    specl:priority \"MUST\" .\n\nspec:OQ1 a specl:OpenIssue ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Whether to support slash namespaces (`/`) as an alternative to the current hash…\" ;\n    dct:description \"Whether to support slash namespaces (`/`) as an alternative to the current hash namespaces (`#`) for spec instances. Hash namespaces resolve all terms to a single document and are the right default for specs authored as a unit. Slash namespaces (as used by Schema.org, where `https://schema.org/Person` returns a dedicated page) would let specs host each requirement, story, or decision at its own dereferenceable URL. This matters for large, multi-team specs where individual elements need independent linking, versioning, or API-driven resolution.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"479\"^^xsd:integer ;\n    specl:recommendation \"support a `namespace_style: hash | slash` front-matter key in a future release; default to `hash`; document the tradeoffs in SYNTAX.md\" ;\n    specl:resolutionStatus \"open\" .\n\nspec:OQ2 a specl:OpenIssue ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Whether to support loading the companion `spec.md` alongside the `.ttl` for…\" ;\n    dct:description \"Whether to support loading the companion `spec.md` alongside the `.ttl` for side-by-side reading.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"482\"^^xsd:integer ;\n    specl:recommendation \"Resolved as no. A markdown parser in the explorer would be a second implementation of the translator and would diverge from it. The need it addresses is met instead by carrying prov:wasDerivedFrom and specl:sourceLine into the detail view (R6.8), and by a CLI command that inlines the Turtle into a copy of the explorer.\" ;\n    specl:resolutionStatus \"resolved\" .\n\nspec:OQ3 a specl:OpenIssue ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Whether to render Mermaid diagrams embedded in description strings\" ;\n    dct:description \"Whether to render Mermaid diagrams embedded in description strings.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"485\"^^xsd:integer ;\n    specl:recommendation \"defer; out of scope for a read-only viewer\" ;\n    specl:resolutionStatus \"open\" .\n\nspec:OQ4 a specl:OpenIssue ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Whether to show SHACL validation results inline by also loading a `shapes.ttl`\" ;\n    dct:description \"Whether to show SHACL validation results inline by also loading a `shapes.ttl`.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"488\"^^xsd:integer ;\n    specl:recommendation \"Resolved as yes, with the mechanism inverted. Shapes are not evaluated in the browser. The explorer consumes the JSON report specl-validate already emits, keyed by focus node. Specified as R12.1 and R12.2.\" ;\n    specl:resolutionStatus \"resolved\" .\n\nspec:OQ5 a specl:OpenIssue ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Light theme toggle\" ;\n    dct:description \"Light theme toggle.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"491\"^^xsd:integer ;\n    specl:recommendation \"Resolved as yes and specified as R3.7. Dark stays the default, light and follow-the-system are one control away, and each presentation is one block of tokens. Structuring the colours as variables, which this question asked for, is what made the second presentation one block rather than a second stylesheet; D4 already prevented a theme from breaking the type indicator.\" ;\n    specl:resolutionStatus \"resolved\" .\n\nspec:OQ6 a specl:OpenIssue ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Export of the current view (selected item as PDF or HTML snippet)\" ;\n    dct:description \"Export of the current view (selected item as PDF or HTML snippet).\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"494\"^^xsd:integer ;\n    specl:recommendation \"Resolved. Fragment addressing (R11.1) covers sharing and a print stylesheet covers the paper case. A dedicated export path is not added.\" ;\n    specl:resolutionStatus \"resolved\" .\n\nspec:OQ7 a specl:OpenIssue ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Is the attesting reader (P5) a distinct persona from the reviewer (P2)? Both…\" ;\n    dct:description \"Is the attesting reader (P5) a distinct persona from the reviewer (P2)? Both read a specification they did not write and both need every item reachable. What separates them is that P5 must be able to assert that the presentation matches the file, which P2 may take on trust.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"498\"^^xsd:integer ;\n    specl:recommendation \"Gated on implementation. If the raw view and the reporting of anything the parser could not represent are built for everyone, then P5 asks for nothing P2 does not already have, and it collapses. Keep the persona until those two capabilities exist and then test whether any requirement still names P5 alone.\" ;\n    specl:resolutionStatus \"open\" .\n\nspec:OQ8 a specl:OpenIssue ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Does authoring belong in the explorer, and if so how much of it?\" ;\n    dct:description \"Does authoring belong in the explorer, and if so how much of it?\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"502\"^^xsd:integer ;\n    specl:recommendation \"Resolved as none, in this artifact. Composition was built under R13.6 and then withdrawn on use: source emitted by a viewer that cannot translate, validate or score it hands the author text nothing has checked, which is worse than sending them back to the file. Editing was never in scope, since parsing markdown in the browser is the second grammar implementation D7 excludes. Authoring belongs in a served mode where the toolchain is present, which is a separate artifact sharing this one's presentation.\" ;\n    specl:resolutionStatus \"resolved\" .\n\nspec:OQ9 a specl:OpenIssue ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Are the explorer's Turtle parser and syntax highlighter the seed of a reusable…\" ;\n    dct:description \"Are the explorer's Turtle parser and syntax highlighter the seed of a reusable component? R2.2 requires a parser sufficient for the emitted format and R7.4 requires highlighting by a small function held in the file. Editor support, a language server or a shared highlighter would want the same grammar handled once and to a higher standard than either requirement sets, and the original design note calling a thirty-line parser sufficient was written before that was in view.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"506\"^^xsd:integer ;\n    specl:recommendation \"Agreed at round 3. Hold both requirements as written for this artifact, and treat a reusable parser as a specl-level component if one is wanted. What stays open is whether specl wants that component; a committed consumer beyond the explorer is the trigger to raise it, since a grammar maintained for one read-only viewer is the thirty-line convenience the original design note described and a grammar maintained for an editor is not. A parser shared between the explorer and an editor is no longer a convenience inside a single-file read-only viewer, and pulling one in is constrained by R1.1 and R1.5. What would change here is only that the explorer consumes the shared grammar where that is possible without a build step or a fetch.\" ;\n    specl:resolutionStatus \"open\" .\n\nspec:D1 a specl:DecisionRecord ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The specification is an item\" ;\n    dct:description \"The specification is presented as an item in the list rather than as a tab in the panel.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"419\"^^xsd:integer ;\n    specl:decisionStatus \"accepted\" ;\n    specl:rationale \"It is a node of the emitted graph like any other node, and the interface was the only place it was treated otherwise. Making it selectable removes the mixed-scope tab strip without introducing a tab set that varies with selection.\" ;\n    specl:affects spec:R3.3 ;\n    specl:affects spec:R4.6 ;\n    specl:affects spec:R4.7 ;\n    specl:affects spec:R8.4 .\n\nspec:D2 a specl:DecisionRecord ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"One definition of every figure\" ;\n    dct:description \"The explorer does not hold a definition of maturity. It displays the figure the toolchain produces, or labels its own as an estimate.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"425\"^^xsd:integer ;\n    specl:decisionStatus \"accepted\" ;\n    specl:rationale \"Two independently computed figures for one artifact, both rendered as authoritative, is a defect in the toolchain rather than in either tool.\" ;\n    specl:affects spec:R5.6 ;\n    specl:affects spec:R5.7 ;\n    specl:affects spec:R12.1 .\n\nspec:D3 a specl:DecisionRecord ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Silence is excluded\" ;\n    dct:description \"Anything the explorer cannot represent is reported. Silent omission is excluded.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"431\"^^xsd:integer ;\n    specl:decisionStatus \"accepted\" ;\n    specl:rationale \"Repeated predicates, list-valued details and unrecognised classes are currently dropped without notice, so the reader cannot distinguish a sparse specification from an incompletely rendered one.\" ;\n    specl:affects spec:R2.6 ;\n    specl:affects spec:R2.7 ;\n    specl:affects spec:R2.9 ;\n    specl:affects spec:R2.10 .\n\nspec:D4 a specl:DecisionRecord ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Encoding is not colour alone\" ;\n    dct:description \"Type and status are encoded through shape or text with colour as a secondary channel.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"437\"^^xsd:integer ;\n    specl:decisionStatus \"accepted\" ;\n    specl:rationale \"The current dots carry no information in greyscale, in print, or for a reader who does not distinguish the hues, and the specification's existing requirement that the colours be themeable addresses the wrong half of the problem.\" ;\n    specl:affects spec:R3.6 ;\n    specl:affects spec:R4.3 .\n\nspec:D5 a specl:DecisionRecord ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Single file, supplied inputs\" ;\n    dct:description \"The explorer remains a single self-contained read-only file. Capabilities requiring evaluation, network access or a build step are supplied to it rather than implemented in it.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"443\"^^xsd:integer ;\n    specl:decisionStatus \"accepted\" ;\n    specl:rationale \"Offline operation from removable media is a stated use case. Every capability added under this plan is either pure presentation of the loaded graph or the presentation of an artifact the CLI already produces.\" ;\n    specl:affects spec:R1.1 ;\n    specl:affects spec:R10.4 ;\n    specl:affects spec:R12.1 .\n\nspec:D6 a specl:DecisionRecord ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The reference is generated\" ;\n    dct:description \"The syntax reference is generated from the toolchain rather than written alongside it.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"449\"^^xsd:integer ;\n    specl:decisionStatus \"accepted\" ;\n    specl:rationale \"The annotation key set already drifted once inside the translator when it was held as two copies. A reference maintained by hand is a third copy, in a different repository artifact, with no test that would catch the divergence.\" ;\n    specl:affects spec:R13.1 ;\n    specl:affects spec:R13.2 .\n\nspec:D7 a specl:DecisionRecord ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Emit, do not parse\" ;\n    dct:description \"The explorer generates specl source and does not interpret it.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"455\"^^xsd:integer ;\n    specl:decisionStatus \"accepted\" ;\n    specl:rationale \"Interpreting markdown in the browser is a second implementation of the translator's grammar, which OQ2 was resolved against. Emitting it requires only the key tables the syntax reference already carries. The asymmetry is what makes composition affordable and round-trip editing not.\" ;\n    specl:affects spec:R13.5 ;\n    specl:affects spec:R13.6 .\n\nspec:DN1 a specl:DesignNote ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The Turtle parser does not need to be RFC-compliant\" ;\n    dct:description \"The Turtle parser does not need to be RFC-compliant. It only needs to handle the output of `specl.spec_to_rdf`, which is deterministic and well-formed. A 30-line parser is sufficient.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"463\"^^xsd:integer .\n\nspec:DN2 a specl:DesignNote ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Prefer declarative CSS over runtime style manipulation\" ;\n    dct:description \"Prefer declarative CSS over runtime style manipulation. Use CSS classes and variables; avoid setting styles via JavaScript except for the maturity bar width and color.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"464\"^^xsd:integer .\n\nspec:DN3 a specl:DesignNote ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Keep the JavaScript in a single `<script>` block at the bottom of the file\" ;\n    dct:description \"Keep the JavaScript in a single `<script>` block at the bottom of the file. No modules, no imports, no bundler.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"465\"^^xsd:integer .\n\nspec:DN4 a specl:DesignNote ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Treat the explorer as read-only\" ;\n    dct:description \"Treat the explorer as read-only. Editing, saving, or uploading is explicitly out of scope for v1.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"466\"^^xsd:integer .\n\nspec:DN5 a specl:DesignNote ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The existing broken `explorer.html` placeholder in the package should be…\" ;\n    dct:description \"The existing broken `explorer.html` placeholder in the package should be replaced wholesale, not patched.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"467\"^^xsd:integer .\n\nspec:DN6 a specl:DesignNote ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Acceptance criteria in this specification state what must be obtainable rather…\" ;\n    dct:description \"Acceptance criteria in this specification state what must be obtainable rather than what must be on screen. Where a criterion says a value is reported or returned on request, an implementation satisfies it by making the value reachable; where a criterion requires something to be visible without being asked for, it says so.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"469\"^^xsd:integer .\n\nspec:DN7 a specl:DesignNote ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Several capabilities depend on one structure: an index from IRI to item, built…\" ;\n    dct:description \"Several capabilities depend on one structure: an i       '<p class="muted">A document comment may follow the front matter: <code>' + esc(ref.frontMatter.comment || '<!--specl\ncreated: YYYY-MM-DD\n-->') + '</code></p>';
    h += '<h4>Sections</h4><table><tr><th>Heading</th><th>Class</th><th>ID prefix</th></tr>' + ref.sections.map(function (s) { return '<tr><td>' + esc(s.heading) + '</td><td>' + esc(s['class']) + '</td><td><code>' + esc(s.prefixes.join(', ')) + '</code></td></tr>'; }).join('') + '<tr><td>' + esc(ref.prose.join(', ')) + '</td><td colspan="2" class="muted">prose; no items</td></tr></table>';
    h += '<p class="muted">Markers: <code>' + esc(ref.markers.parked) + '</code> parks a heading no class models yet; <code>' + esc(ref.markers.prose) + '</code> declares prose under an item heading deliberate.</p>';
    h += '<h4>Item form</h4><pre>' + esc(ref.itemForm) + '</pre>';
    h += '<h4>Annotation keys</h4><table><tr><th>Key</th><th>Property</th><th></th></tr>' + ref.keys.map(function (k) { return '<tr><td><code>' + esc(k.key) + '</code></td><td class="muted small">' + esc(k.property || (k.resolvesTo ? 'decisionStatus on a decision, resolutionStatus otherwise' : '')) + '</td><td class="muted">' + (k.reference ? 'reference' + (k.range ? ' to ' + esc(local(k.range)) : '') : k.contextual ? 'context-sensitive' : 'literal') + '</td></tr>'; }).join('') + '</table>';
    h += '<h4>What each class expects</h4>';
    ref.classes.forEach(function (c) {
      if (!c.expects.length && !c.selected) return;
      h += '<details' + (c.selected ? ' open class="sel"' : '') + '><summary>' + esc(c.cls) + (c.headings.length ? ' <span class="muted">under \u201c' + esc(c.headings[0]) + '\u201d, prefix ' + esc(c.prefixes[0] || '') + '</span>' : '') + (c.selected ? ' <span class="tag">selected item</span>' : '') + '</summary><ul class="expect">' +
        c.expects.map(function (e) {
          var state = c.selected ? (e.applies === false ? 'n/a' : e.present ? 'present' : e.required ? 'absent' : 'optional') : '';
          return '<li class="' + state + '"><code>' + esc(e.key) + '</code> <span class="sev ' + esc(e.severity) + '">' + esc(e.severity) + '</span>' + (state ? ' <span class="state">' + state + '</span>' : '') + (e.allowed ? ' <span class="muted">one of ' + esc(e.allowed.join(', ')) + '</span>' : '') + (e.condition ? ' <span class="muted">when ' + esc(JSON.stringify(e.condition)) + '</span>' : '') + '<div class="muted small">' + esc(e.message) + '</div></li>';
        }).join('') + '</ul></details>';
    });
    dr.innerHTML = h;
    $('drawer-close').onclick = toggleDrawer;
  }
  function toggleDrawer() { S.drawer = !S.drawer; renderDrawer(); }

  function renderTabs() {
    document.querySelector('.tabbar').hidden = !S.model;
    $('panel').setAttribute('aria-labelledby', 'tab-' + S.tab);
    Array.prototype.forEach.call(document.querySelectorAll('.tabs [role=tab]'), function (b) { var on = b.dataset.tab === S.tab; b.classList.toggle('active', on); b.setAttribute('aria-selected', on ? 'true' : 'false'); b.tabIndex = on ? 0 : -1; });
    $('back').disabled = S.pos <= 0; $('fwd').disabled = S.pos >= S.trail.length - 1;
  }
  function renderAll() { renderHeader(); renderReport(); renderList(); renderTabs(); renderPanel(); renderDrawer(); }
  /* One readiness per paint: the header, the list filter and the panel all read it. */
  function currentReadiness() { if (!S._r || S._rk !== (S.report ? 'r' : '') + (S.score ? 's' : '')) { S._r = readiness(S.model, S.grammar, S.report, S.score); S._rk = (S.report ? 'r' : '') + (S.score ? 's' : ''); } return S._r; }

  /* ---------------------------------------------------------- selection, trail, fragment */
  /* A trail entry is a view, not a selection: which item, which tab, which
     pane, and how the list was narrowed. Going back from an item reached
     through a chip therefore returns to that narrowed list, which is what
     "back" means to someone who got there by tapping. Typing in the filter
     box does not push; discrete navigations do. */
  function snapshot() { return {iri: S.selected ? S.selected.iri : null, tab: S.tab, whole: S.whole, pane: currentPane(), onlyClass: S.onlyClass, onlyState: S.onlyState, filter: S.filter}; }
  function sameView(a, b) { return a && b && a.iri === b.iri && a.tab === b.tab && a.whole === b.whole && a.pane === b.pane && a.onlyClass === b.onlyClass && a.onlyState === b.onlyState && a.filter === b.filter; }
  function pushView() {
    var v = snapshot();
    if (sameView(S.trail[S.pos], v)) return;
    S.trail = S.trail.slice(0, S.pos + 1); S.trail.push(v); S.pos = S.trail.length - 1;
    renderTabs();
  }
  function restore(v) {
    S.tab = v.tab; S.whole = v.whole; S.onlyClass = v.onlyClass; S.onlyState = v.onlyState; S.filter = v.filter;
    $('filter').value = v.filter || '';
    S.selected = v.iri && S.model ? (v.iri === (S.model.spec && S.model.spec.iri) ? S.model.spec : S.model.index.resolve(v.iri)) : null;
    renderList(); setPane(v.pane); writeHash(); renderTabs(); renderPanel(); if (S.drawer) renderDrawer();
    scrollToActive();
  }
  function scrollToActive() {
    if (!S.selected) return;
    var row = $('list').querySelector('.item[data-iri="' + S.selected.iri.replace(/"/g, '\\"') + '"]');
    if (row && row.scrollIntoView) row.scrollIntoView({block: 'nearest'});
  }
  function select(iri, tab, fromTrail) {
    var m = S.model; if (!m) return;
    var it = iri === (m.spec && m.spec.iri) ? m.spec : m.index.resolve(iri);
    if (!it || (it.cls !== 'Specification' && ITEM_CLASSES.indexOf(it.cls) < 0)) return;
    S.selected = it; if (tab) S.tab = tab;
    if (!fromTrail) paneForSelection();
    writeHash(); paintActive(); renderTabs(); renderPanel(); if (S.drawer) renderDrawer();
    if (!fromTrail) pushView();
    scrollToActive();
  }
  function writeHash() {
    if (!S.selected) return;
    var h = encodeHash(S.selected.id, S.tab, S.whole); if (location.hash === h) return;
    try { history.replaceState(null, '', h); } catch (e) { location.hash = h; }
  }
  function applyHash() {
    var h = decodeHash(location.hash); if (!h || !S.model) return false;
    var it = findById(S.model, h.id); if (!it) return false;
    if (S.selected === it && S.tab === h.tab && S.whole === h.whole) return true;
    S.whole = h.whole; select(it.iri, h.tab, false); return true;
  }

  /* ---------------------------------------------------------- loading */
  function loadGraph(text, meta) {
    S.model = parse(text); S.selected = null; S.trail = []; S.pos = -1; S.filter = ''; S.onlyClass = null; S.onlyState = null; S.listKey = ''; $('filter').value = '';
    S.report = meta && meta.report || null; S.score = meta && meta.score || null; S._r = null;
    renderAll();
    if (S.model.spec && !applyHash()) select(S.model.spec.iri, 'detail', false);
    setPane(S.model.spec ? 'detail' : 'list');
  }
  function loadExample() { if (EXAMPLE) loadGraph(EXAMPLE.turtle || '', {report: SLOT_REPORT, score: SLOT_SCORE}); }
  async function onFiles(e) { var fs = e.target.files; for (var i = 0; i < fs.length; i++) await loadFile(fs[i]); try { e.target.value = ''; } catch (x) {} }
  $('file').onchange = onFiles;
  function note(kind, detail) { if (S.model) { S.model.report.push({kind: kind, detail: detail}); renderReport(); } else { $('panel').className = 'empty error'; $('panel').textContent = detail; } }
  function loadJson(text) {
    var j; try { j = JSON.parse(text); } catch (e) { note('rejected-file', 'a dropped file was not JSON and not Turtle; nothing loaded'); return; }
    if (j && Array.isArray(j.results)) {
      S.report = j; S.listKey = ''; S._r = null;
      if (S.model && j.results.length && !j.results.some(function (r) { return S.model.index.isResolvable(r.focus); }))
        S.model.report.push({kind: 'report-mismatch', detail: 'the validation report names no subject in this graph; it may belong to another specification'});
      renderAll(); return;
    }
    if (j && ('score' in j) && ('total' in j)) { S.score = j; S._r = null; renderAll(); return; }
    if (j && j.keys && j.expectations) { S.grammar = j; S.listKey = ''; S._r = null; renderAll(); return; }
    note('rejected-file', 'a dropped JSON file was not a validation report, a score, or a grammar; nothing loaded');
  }
  async function loadFile(f) {
    if (!f) return; var text = await f.text();
    if (/\.json$/i.test(f.name || '') || /^\s*\{/.test(text)) loadJson(text); else loadGraph(text, null);
  }

  $('filter').oninput = function (e) { S.filter = e.target.value.trim(); renderList(); };
  $('title').onclick = function () { if (S.model && S.model.spec) select(S.model.spec.iri, S.tab, false); };
  $('syntax').onclick = toggleDrawer;
  /* Dark, light, or follow the system. Not persisted: the file holds no state
     between openings, and a theme is one tap to set. */
  var THEMES = ['dark', 'light', 'auto'];
  $('theme').onclick = function () {
    var el = document.documentElement;
    var next = THEMES[(THEMES.indexOf(el.getAttribute('data-theme')) + 1) % THEMES.length];
    el.setAttribute('data-theme', next); $('theme').textContent = next;
  };
  $('panes').onclick = function () { setPane('list'); var row = $('list').querySelector('.item.active') || $('list').querySelector('.item'); if (row) row.focus(); };
  $('maturity').onclick = function () { if (S.model && S.model.spec) select(S.model.spec.iri, 'detail', false); };
  Array.prototype.forEach.call(document.querySelectorAll('.tabs [role=tab]'), function (b) {
    b.onclick = function () { S.tab = b.dataset.tab; writeHash(); renderTabs(); renderPanel(); pushView(); };
    b.onkeydown = function (e) { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { var tabs = Array.prototype.slice.call(document.querySelectorAll('.tabs [role=tab]')); var i = tabs.indexOf(b) + (e.key === 'ArrowRight' ? 1 : -1); if (i >= 0 && i < tabs.length) { tabs[i].click(); tabs[i].focus(); } } };
  });
  $('back').onclick = function () { if (S.pos > 0) { S.pos--; restore(S.trail[S.pos]); } };
  $('fwd').onclick = function () { if (S.pos < S.trail.length - 1) { S.pos++; restore(S.trail[S.pos]); } };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.drawer) toggleDrawer(); });
  window.addEventListener('hashchange', function () { applyHash(); });
  var ov = $('overlay'), dc = 0;
  window.addEventListener('dragenter', function (e) { e.preventDefault(); dc++; ov.classList.add('active'); });
  window.addEventListener('dragleave', function (e) { e.preventDefault(); if (--dc <= 0) ov.classList.remove('active'); });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', async function (e) { e.preventDefault(); dc = 0; ov.classList.remove('active'); var fs = e.dataTransfer.files; for (var i = 0; i < fs.length; i++) await loadFile(fs[i]); });
  renderAll();
  /* A composed copy carries a bundled graph marked autoload (S4): open on it. */
  if (EXAMPLE && EXAMPLE.autoload) loadExample();
}
</script></body></html>
