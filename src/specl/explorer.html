<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>specl explorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:dark;--bg:#0f1115;--panel:#161a22;--border:#262b36;--text:#e6e8ee;--muted:#8a92a6;
--accent:#4ea1ff;--good:#3fb950;--warn:#d29922;--bad:#f85149;
--req:#3fb950;--us:#4ea1ff;--issue:#d29922;--adr:#a371f7;--note:#8a92a6;--query:#3fb6d8;--persona:#e2796f;--agent:#e2796f;--spec:#e6e8ee;
--hl-c:#8b949e;--hl-s:#a5d6ff;--hl-i:#a5d6ff;--hl-k:#ff7b72;--hl-p:#79c0ff}
/* Light. Dark is the default; the header control switches, and "auto" follows
   the system. Every hue is a token, so a theme is one block and nothing else
   in the stylesheet knows which one is applied (R3.5, D4). */
:root[data-theme="light"]{color-scheme:light;--bg:#ffffff;--panel:#f4f6f9;--border:#d5dae2;--text:#12161c;--muted:#5a6472;
--accent:#0a5fd6;--good:#1a7f37;--warn:#8a5a00;--bad:#b42318;
--req:#1a7f37;--us:#0a5fd6;--issue:#8a5a00;--adr:#6b3fc0;--note:#5a6472;--query:#0d6d86;--persona:#b1453a;--agent:#b1453a;--spec:#12161c;
--hl-c:#5a6472;--hl-s:#0a4a8f;--hl-i:#0a4a8f;--hl-k:#b42318;--hl-p:#0d6d86}
@media (prefers-color-scheme:light){
:root[data-theme="auto"]{color-scheme:light;--bg:#ffffff;--panel:#f4f6f9;--border:#d5dae2;--text:#12161c;--muted:#5a6472;
--accent:#0a5fd6;--good:#1a7f37;--warn:#8a5a00;--bad:#b42318;
--req:#1a7f37;--us:#0a5fd6;--issue:#8a5a00;--adr:#6b3fc0;--note:#5a6472;--query:#0d6d86;--persona:#b1453a;--agent:#b1453a;--spec:#12161c;
--hl-c:#5a6472;--hl-s:#0a4a8f;--hl-i:#0a4a8f;--hl-k:#b42318;--hl-p:#0d6d86}
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;font:14px/1.5 -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;height:100dvh;display:flex;flex-direction:column}
header{padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hrow{display:contents}
header h1{margin:0;font-size:16px;font-weight:600}
#title{background:none;border:none;color:var(--text);font:inherit;font-size:16px;font-weight:600;padding:0;cursor:pointer;text-align:left}
#title:disabled{cursor:default}
#title:hover:not(:disabled){text-decoration:underline}
.status{padding:2px 8px;border-radius:3px;background:var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.meta{color:var(--muted);font-size:12px}
.meta.bad{color:var(--bad)}
.nav{margin-left:auto;display:flex;gap:6px}
.btn{padding:4px 10px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:3px;font:inherit;font-size:12px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.btn.on{border-color:var(--accent);color:var(--accent)}
main{flex:1;display:grid;grid-template-columns:340px 1fr;overflow:hidden;min-height:0}
main>aside{border-right:1px solid var(--border);overflow:hidden;background:var(--panel);display:flex;flex-direction:column}
main>aside input{width:100%;padding:10px 14px;background:var(--bg);color:var(--text);border:none;border-bottom:1px solid var(--border);font:inherit;outline:none}
main>aside input:focus{border-bottom-color:var(--accent)}
#list{flex:1;overflow-y:auto}
.group{padding:6px 0}
.group.pinned{border-bottom:1px solid var(--border);background:rgba(255,255,255,.02)}
.group-label{padding:6px 16px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.group-label .n{color:var(--text);opacity:.6}
.item{padding:7px 16px 7px 14px;cursor:pointer;border-left:3px solid transparent;outline:none}
.item:hover{background:var(--bg)}
.item:focus{background:var(--bg);box-shadow:inset 0 0 0 1px var(--accent)}
.item.active{background:var(--bg);border-left-color:var(--accent)}
.item .row{display:flex;gap:8px;align-items:baseline}
.item .id{font-weight:500;font-size:13px}
.item .sub{color:var(--muted);font-size:11px}
.glyph{font:600 9px/1 ui-monospace,Menlo,monospace;letter-spacing:.5px;padding:2px 4px;border-radius:2px;background:var(--border);color:var(--text);min-width:28px;text-align:center;display:inline-block}
.item.req .glyph{color:var(--req)}.item.us .glyph{color:var(--us)}.item.issue .glyph{color:var(--issue)}.item.adr .glyph{color:var(--adr)}.item.note .glyph{color:var(--note)}.item.query .glyph{color:var(--query)}.item.persona .glyph,.item.agent .glyph{color:var(--persona)}
.item .preview{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.item .why{color:var(--warn);font-size:11px;font-style:italic;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
section{overflow-y:auto;padding:0 32px 24px;min-width:0}
.tabbar{display:flex;gap:4px;margin:0 -32px 20px;padding:0 32px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:2}
.tabs{display:flex;gap:4px}
.tabs [role=tab]{padding:10px 16px;background:none;border:none;color:var(--muted);cursor:pointer;font:inherit;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs [role=tab].active{color:var(--text);border-bottom-color:var(--accent)}
.tabs [role=tab]:focus-visible{outline:1px solid var(--accent)}
h2{margin:0 0 4px;font-size:20px;display:flex;gap:8px;align-items:baseline}
h2 .glyph{font-size:10px}
h3{margin:24px 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.type{color:var(--muted);font-size:12px;margin-bottom:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.type .iri{font:11px ui-monospace,Menlo,monospace;opacity:.7;overflow:hidden;text-overflow:ellipsis;max-width:60ch}
.prov{color:var(--muted);font-size:12px;margin-bottom:16px}
dl{display:grid;grid-template-columns:180px 1fr;gap:10px 20px;margin:0}
dt{color:var(--muted);font-size:12px;padding-top:2px}
dt.absent{color:var(--warn)}
dd{margin:0;word-wrap:break-word;white-space:pre-wrap;user-select:text}
dd .v{display:block}dd .v+.v{margin-top:6px}
.missing{color:var(--warn);font-style:italic;opacity:.85}
.details{margin:6px 0 0;padding-left:18px}
.ref{color:var(--accent);text-decoration:none;font-weight:500}
.ref:hover{text-decoration:underline}
.reflabel{color:var(--muted)}
.ref.unresolved{color:var(--warn);text-decoration:underline dotted}
.ref.node{color:var(--text);text-decoration:underline dotted}
.chips{display:flex;gap:8px;margin:12px 0 20px;flex-wrap:wrap}
.chip{padding:3px 10px;border-radius:12px;font-size:11px;background:var(--border);color:var(--text);border:1px solid transparent;cursor:pointer;font-family:inherit}
.chip.on{border-color:var(--accent);color:var(--accent)}
.chip.muted{cursor:default;color:var(--muted);font-style:italic}
.rawbar{display:flex;gap:6px;align-items:center;margin:12px 0}
pre{background:var(--panel);padding:16px;border-radius:6px;overflow-x:auto;font:12px/1.5 ui-monospace,Menlo,monospace;border:1px solid var(--border);white-space:pre}
/* The number is generated content, so selecting the block copies the Turtle and not the gutter. */
pre.numbered{padding-left:0}
pre.numbered .line{display:block;padding-left:.75em}
pre.numbered .line::before{content:attr(data-n);display:inline-block;width:4ch;margin-right:1.25em;text-align:right;color:var(--muted);opacity:.65;user-select:none;-webkit-user-select:none}
pre.numbered .line.gap::before{opacity:.35}
pre .c{color:var(--hl-c);font-style:italic}pre .s{color:var(--hl-s)}pre .i{color:var(--hl-i);text-decoration:underline dotted}pre .k{color:var(--hl-k);font-weight:600}pre .p{color:var(--hl-p)}pre .subj{color:var(--hl-k);font-weight:600}
.empty{color:var(--muted);text-align:center;padding:60px 20px;max-width:56ch;margin:0 auto}
.empty.error{color:var(--bad)}
.filterbar{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border);background:var(--bg)}
.filterbar .btn{margin-left:auto}
.chip.figure{cursor:pointer}
.report{margin:0;padding:10px 16px;background:rgba(210,153,34,.12);border-bottom:1px solid var(--border);font-size:12px;color:var(--warn)}
.report ul{margin:6px 0 0;padding-left:18px}
.report.bad{background:rgba(248,81,73,.12);color:var(--bad)}
.drop-overlay{position:fixed;inset:0;background:rgba(78,161,255,.1);border:3px dashed var(--accent);display:none;align-items:center;justify-content:center;font-size:18px;color:var(--accent);z-index:100;pointer-events:none}
.drop-overlay.active{display:flex}
code{font:12px ui-monospace,Menlo,monospace}
.tabbar[hidden]{display:none}
.file-btn{position:relative;display:inline-block;cursor:pointer}
.file-btn input{position:absolute;opacity:0;width:1px;height:1px;left:0;top:0}
#panes{display:none}
@media print{
  :root{--bg:#fff;--panel:#fff;--border:#bbb;--text:#000;--muted:#444;--accent:#000;--warn:#000;--bad:#000;--good:#000}
  body{height:auto;display:block;font-size:11pt}
  header{border:none;padding:0 0 8pt}
  .nav,.maturity .bar,#panes,.tabs,aside,#drawer,.drop-overlay,.btn,button.chip{display:none !important}
  main{display:block;overflow:visible}
  section{overflow:visible;padding:0}
  .type .iri{display:inline;max-width:none}
  a.ref{color:var(--text);text-decoration:underline}
  a.ref::after{content:" (" attr(href) ")";font-size:9pt;color:var(--muted)}
  pre{white-space:pre-wrap;border:1px solid var(--border)}
  details{display:block}details>summary{display:none}details.def dl{display:grid}
  .chip{border:1px solid var(--border);background:none}
  h3{page-break-after:avoid}
}
@media (max-width:720px){
  body{font-size:15px}
  /* Block layout for the header: title with the status badge floated
     right, then the maturity bar filling the space left of the buttons. */
  /* Two header rows on a phone: title with the status badge, then the
     maturity bar beside the buttons. The title cell is the only one that
     shrinks, and it truncates rather than pushing the badge off-screen. */
  header{display:block;padding:8px 12px 6px}
  .hrow{display:flex;align-items:center;gap:8px;min-width:0}
  .hrow2{margin-top:6px}
  header h1{flex:1 1 0;min-width:0}
  #title{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:block}
  .hrow1 .status,.hrow1 #version{flex:0 0 auto;white-space:nowrap}
  #contract{display:none}
  .maturity{flex:1 1 0;min-width:0;margin:0;display:flex;align-items:center;gap:8px}
  .mbtn{flex:0 0 auto;white-space:nowrap;line-height:1.3}
  .bar{flex:1 1 40px;width:auto;min-width:40px}
  .nav{flex:0 0 auto;display:flex;gap:6px;margin-left:0}
  .nav .lbl{display:none}
  #theme{display:none}
  .nav .btn{min-width:44px}
  .btn{padding:8px 12px;font-size:13px;min-height:40px}
  /* One natural page scroll on a phone: no nested scroll regions. */
  body{display:block;height:auto;min-height:100vh;min-height:100dvh}
  main{display:block;overflow:visible}
  main>aside,section{height:auto;overflow:visible}
  #list{overflow:visible}
  main:not(.mode-list)>aside{display:none}
  main.mode-list section{display:none}
  main>aside{border-right:none;display:block}
  main>aside input{padding:12px 14px;font-size:16px;min-height:44px}
  .item{padding:12px 14px;min-height:44px}
  .item .preview{white-space:normal}
  .item .why{white-space:normal}
  section{padding:0 14px calc(24px + env(safe-area-inset-bottom))}
  .tabbar{margin:0 -14px 16px;padding:0 6px;gap:0}
  .tabs{flex:1 1 auto}
  .tabs [role=tab]{padding:12px 12px;min-height:44px;flex:1 1 auto;text-align:center}
  #panes{display:inline-block;padding:10px 12px;background:none;border:none;border-bottom:2px solid transparent;color:var(--accent);font:inherit;cursor:pointer;min-height:44px}
  h2{font-size:18px}
  .type .iri{display:none}
  dl{display:block}
  dt{margin-top:10px}
  dd{margin:2px 0 0}
  dl.tight{display:block}
  .chip{padding:8px 12px;font-size:12px;min-height:36px}
  .chips{gap:6px}
  pre{font-size:11px;padding:12px}
  pre.numbered{padding-left:0}
  pre.numbered .line::before{width:3ch;margin-right:.75em}
  .drawer{width:100vw;left:0;padding:14px;box-shadow:none}
  .drawer table{display:block;overflow-x:auto}
  .drawer input,.drawer select{font-size:16px;min-height:40px}
  .drawer textarea{font-size:13px}
  .rawbar{flex-wrap:wrap}
  .empty{padding:32px 8px}
  .empty .btn{width:100%;min-height:48px;font-size:15px;margin-top:8px}
  .drop-overlay{font-size:15px;padding:20px;text-align:center}
}
.maturity{display:flex;align-items:center;gap:8px;margin-left:8px}
.mbtn{background:none;border:none;cursor:pointer;font:inherit;font-size:12px;padding:0}
.mbtn:hover{text-decoration:underline}
.bar{width:140px;height:8px;background:var(--border);border-radius:4px;overflow:hidden;display:inline-block}
.bar>i{display:block;height:100%;transition:width .3s,background .3s}
.chip.figure{border:1px solid var(--border);font-weight:600}
.chip.good{background:rgba(63,185,80,.15);color:var(--good)}
.chip.warn{background:rgba(210,153,34,.15);color:var(--warn)}
.fmark{font:600 10px ui-monospace,Menlo,monospace;color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:0 5px;margin-left:auto}
.muted{color:var(--muted)}.small{font-size:12px}
details.def{margin:4px 0 16px;font-size:13px}
details.def summary{cursor:pointer;color:var(--muted)}
dl.tight{grid-template-columns:110px 1fr;gap:4px 14px;margin-top:8px;font-size:12px}
.contrib{margin:4px 0 0;padding-left:20px}
.contrib li{margin-bottom:6px}
.contrib ul{margin:2px 0 0;padding-left:18px;font-size:12px}
.sev{font:600 10px ui-monospace,Menlo,monospace;padding:1px 5px;border-radius:2px;background:var(--border)}
.sev.Violation{color:var(--bad)}.sev.Warning{color:var(--warn)}.sev.Info{color:var(--muted)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,90vw);background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;padding:16px 20px;z-index:50;box-shadow:-8px 0 24px rgba(0,0,0,.4);font-size:13px}
.drawer-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.drawer-head .btn{margin-left:auto}
.drawer h4{margin:18px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.drawer table{border-collapse:collapse;width:100%;font-size:12px}
.drawer th,.drawer td{text-align:left;padding:3px 6px;border-bottom:1px solid var(--border);vertical-align:top}
.drawer details{margin:4px 0}.drawer details.sel{border-left:2px solid var(--accent);padding-left:8px}
.drawer summary{cursor:pointer}
.expect{margin:6px 0 0;padding-left:18px}
.expect li{margin-bottom:6px}
.expect li.absent>code{color:var(--warn)}.expect li.absent .state{color:var(--warn)}
.expect li.present .state{color:var(--good)}
.expect li.optional .state{color:var(--muted)}.expect li.n\/a{opacity:.5}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);margin-left:6px}
.drawer textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);font:12px/1.4 ui-monospace,Menlo,monospace;padding:8px;margin-top:8px}
.drawer select,.drawer input{background:var(--bg);color:var(--text);border:1px solid var(--border);font:inherit;font-size:12px;padding:4px 6px}
</style></head><body>
<header>
  <div class="hrow hrow1">
    <h1><button id="title" type="button" disabled title="Select the specification">specl explorer</button></h1>
    <span class="status" id="status">no spec</span>
    <span class="meta" id="version"></span>
    <span class="meta" id="contract"></span>
  </div>
  <div class="hrow hrow2">
    <span class="maturity"><button class="meta mbtn" id="maturity" type="button" title="Open the specification view">maturity &#8212;</button><span class="bar" role="img" aria-label="maturity"><i id="bar"></i></span></span>
    <span class="nav"><button class="btn" id="theme" type="button" aria-label="Colour theme">dark</button><button class="btn" id="syntax" type="button" aria-expanded="false" aria-controls="drawer">syntax</button><button class="btn" id="back" type="button" disabled aria-label="Back">&#8592;<span class="lbl"> back</span></button><button class="btn" id="fwd" type="button" disabled aria-label="Forward"><span class="lbl">forward </span>&#8594;</button></span>
  </div>
</header>
<main>
  <aside>
    <input type="file" id="file" accept=".ttl,.json" multiple aria-label="Load spec.ttl or a validation report">
    <input type="text" id="filter" placeholder="filter by id, label, description..." aria-label="Filter items">
    <div id="report" class="report" hidden></div>
    <div id="filterbar" class="filterbar" hidden></div>
    <div id="list" aria-label="Items"></div>
  </aside>
  <section>
    <div class="tabbar"><button id="panes" type="button" aria-label="Show the item list" aria-controls="list">&#9776; items</button><div class="tabs" role="tablist" aria-label="Views of the selected item"><button role="tab" id="tab-detail" data-tab="detail" class="active" aria-selected="true" aria-controls="panel">Detail</button><button role="tab" id="tab-ttl" data-tab="ttl" aria-selected="false" tabindex="-1" aria-controls="panel">Raw Turtle</button></div></div>
    <div id="panel" class="empty" role="tabpanel" aria-labelledby="tab-detail" tabindex="0"><p>Open a <code>spec.ttl</code> with the file control, or drop one here.</p><p>A <code>spec.ttl</code> is produced with <code>specl-translate spec.md spec.ttl</code>.</p></div>
  </section>
</main>
<div id="drawer" class="drawer" role="complementary" hidden aria-label="Syntax reference"></div>

"Warning","message":"Decision record should capture rationale.","minCount":1},{"property":"https://w3id.org/specl/ns#affects","key":"affects","severity":"Warning","message":"Decision record should link to the requirements or components it affects.","minCount":1}],"DesignNote":[{"property":"https://w3id.org/specl/ns#supersededBy","key":"supersededBy","severity":"Warning","message":"An item marked superseded should name the item that replaces it.","minCount":1,"condition":{"itemStatus":"superseded"}},{"property":"https://w3id.org/specl/ns#supersededBy","key":"supersededBy","severity":"Warning","message":"A withdrawn item is struck rather than replaced; use superseded if a successor exists.","maxCount":0,"condition":{"itemStatus":"withdrawn"}}],"OpenIssue":[{"property":"https://w3id.org/specl/ns#supersededBy","key":"supersededBy","severity":"Warning","message":"An item marked superseded should name the item that replaces it.","minCount":1,"condition":{"itemStatus":"superseded"}},{"property":"https://w3id.org/specl/ns#supersededBy","key":"supersededBy","severity":"Warning","message":"A withdrawn item is struck rather than replaced; use superseded if a successor exists.","maxCount":0,"condition":{"itemStatus":"withdrawn"}},{"property":"http://purl.org/dc/terms/description","key":"description","severity":"Violation","message":"Open issue needs a description.","minCount":1},{"property":"https://w3id.org/specl/ns#recommendation","key":"recommendation","severity":"Warning","message":"Open issue should carry a recommendation.","minCount":1},{"property":"https://w3id.org/specl/ns#owner","key":"owner","severity":"Warning","message":"Open issue should name an accountable agent via specl:owner.","minCount":1},{"property":"https://w3id.org/specl/ns#resolutionStatus","key":"resolutionStatus","severity":"Warning","message":"Open issue should track resolution status.","maxCount":1,"in":["open","in-review","resolved","deferred"]}],"Persona":[{"property":"https://w3id.org/specl/ns#supersededBy","key":"supersededBy","severity":"Warning","message":"An item marked superseded should name the item that replaces it.","minCount":1,"condition":{"itemStatus":"superseded"}},{"property":"https://w3id.org/specl/ns#supersededBy","key":"supersededBy","severity":"Warning","message":"A withdrawn item is struck rather than replaced; use superseded if a successor exists.","maxCount":0,"condition":{"itemStatus":"withdrawn"}},{"property":"http://purl.org/dc/terms/title","key":"title","severity":"Violation","message":"Persona must have a dct:title.","minCount":1}],"UserStory":[{"property":"https://w3id.org/specl/ns#supersededBy","key":"supersededBy","severity":"Warning","message":"An item marked superseded should name the item that replaces it.","minCount":1,"condition":{"itemStatus":"superseded"}},{"property":"https://w3id.org/specl/ns#supersededBy","key":"supersededBy","severity":"Warning","message":"A withdrawn item is struck rather than replaced; use superseded if a successor exists.","maxCount":0,"condition":{"itemStatus":"withdrawn"}},{"property":"http://purl.org/dc/terms/description","key":"description","severity":"Violation","message":"User story needs a description.","minCount":1},{"property":"https://w3id.org/specl/ns#partOf","key":"partOf","severity":"Violation","message":"User story must be linked to its parent Specification.","minCount":1},{"property":"https://w3id.org/specl/ns#role","key":"role","severity":"Warning","message":"User story should declare who it is about via specl:role, naming a declared persona.","minCount":1},{"property":"https://w3id.org/specl/ns#benefit","key":"benefit","severity":"Warning","message":"User story should declare why it matters via specl:benefit.","minCount":1},{"property":"https://w3id.org/specl/ns#acceptanceCriterion","key":"acceptanceCriterion","severity":"Warning","message":"User story should have at least one Given/When/Then acceptance criterion.","minCount":1}]},"score":{"population":"items of every item class, excluding itemStatus superseded or withdrawn","clean":"the item is the focus of no validation result at any severity, and an OpenIssue is not clean unless resolutionStatus is resolved or deferred","weights":{"MUST":4,"SHOULD":3,"COULD":2,"WONT":1,"default":2},"figure":"round(100 * sum(weight of clean items) / sum(weight of all items)); none when the gate fails","gate":"any Violation fails; at status production, any Warning fails too","source":"specl.validate_spec.score_graph, read from the installed version; not yet published by specl (UP-2)"}}</script>
<script type="application/json" id="slot-example">{"title":"specl Spec Explorer","version":"1.0.0","source":"fixtures/explorer-spec.ttl","built":"2026-09-01T13:10:23Z","autoload":false,"turtle":"@prefix specl: <https://w3id.org/specl/ns#> .\n@prefix spec: <https://w3id.org/specl/explorer/spec#> .\n@prefix prov: <http://www.w3.org/ns/prov#> .\n@prefix dct:  <http://purl.org/dc/terms/> .\n@prefix xsd:  <http://www.w3.org/2001/XMLSchema#> .\n@prefix rdf:  <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .\n@prefix skos: <http://www.w3.org/2004/02/skos/core#> .\n\n<https://w3id.org/specl/explorer/spec> a specl:Specification ;\n    dct:conformsTo <https://w3id.org/specl/contract/2> ;\n    dct:title \"specl Spec Explorer\" ;\n    dct:hasVersion \"1.0.0\" ;\n    specl:status \"prototype\" ;\n    dct:identifier \"explorer-001\" ;\n    specl:prefix \"EXPL\" ;\n    dct:created \"2026-08-19\"^^xsd:date ;\n    specl:intent \"\"\"Define a single-file, zero-dependency HTML tool that lets a reader load a specl-generated `spec.ttl` file and understand its content, structure, raw Turtle representation, and production maturity in one view without any build step, server, or network access.\"\"\" ;\n    specl:purpose \"\"\"Replace the current drag-and-drop viewer (which only lists subject IDs and short descriptions) with an actual reading tool. A spec author, reviewer, or downstream AI agent should be able to open the explorer, drop a `spec.ttl`, and immediately see the spec's metadata, every requirement and user story with full detail, where gaps exist, and how close the spec is to production-ready — with the raw Turtle one tab away for verification.\"\"\" .\n\nspec:source-e9e453bf a specl:SourceDocument ;\n    dct:identifier \"spec.md\" .\n\nspec:R1.1 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The explorer must be a single self-contained `.html` file with no external…\" ;\n    dct:description \"The explorer must be a single self-contained `.html` file with no external runtime dependencies (no CDN scripts, no fonts, no network calls).\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"24\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given the built file, when it is opened with network access blocked, then it renders and operates with no failed or attempted external request.\" .\n\nspec:R1.2 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"It must open and function correctly from the local filesystem (`file://`) in…\" ;\n    dct:description \"It must open and function correctly from the local filesystem (`file://`) in modern Chromium, Firefox, and Safari.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"27\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given the file opened over file:// in current Chromium, Firefox and Safari, when a specification is loaded in each, then the item list, both tabs and the syntax reference render in all three with no console error.\" .\n\nspec:R1.3 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The explorer must be obtainable without a build step and without an…\" ;\n    dct:description \"The explorer must be obtainable without a build step and without an installation, from at least one published channel, and every channel that publishes it must serve an identical file for a given release. Inclusion in the Python distribution is one such channel and is not required where another channel satisfies R1.6 and R10.4.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"30\"^^xsd:integer ;\n    specl:priority \"MUST\" ;\n    specl:acceptanceCriterion \"Given a release, when the explorer is obtained from each channel that publishes it, then the files are identical; and given a reader with no toolchain installed, when they seek the explorer, then at least one channel serves it to them directly.\" ;\n    specl:rationale \"The original wording made the Python distribution the only route, which is the inversion PR1 identifies: seeing the tool required installing the thing the tool exists to demonstrate. What matters is that a reader can obtain it without building or installing anything and that two channels never serve two different explorers.\" .\n\nspec:R1.4 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The explorer must remain one file with no build step, no bundler, and no…\" ;\n    dct:description \"The explorer must remain one file with no build step, no bundler, and no external runtime dependency, and must render its first view without waiting on anything it does not already contain.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"35\"^^xsd:integer ;\n    specl:priority \"MUST\" ;\n    specl:acceptanceCriterion \"Given the built file, when it is opened with network access blocked, then it renders with no failed requests and no deferred load.\" ;\n    specl:rationale \"The byte cap was a proxy for keeping the tool dependency-free and instantly loadable. Stated as a number it now forbids capabilities that cost nothing against the property it was protecting.\" .\n\nspec:R1.5 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"No build step is required to run the explorer\" ;\n    dct:description \"No build step is required to run the explorer. The file is authored HTML, CSS and JavaScript with no bundler, transpiler or module loader. A generation step that produces embedded reference data under R13.2 is permitted, and its output is committed alongside the file.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"40\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given the repository, when the explorer is produced, then the only generated content in the file is the reference data of R13.2, and running the file requires no bundler, transpiler or module loader.\" .\n\nspec:R1.6 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Where the toolchain provides a command that composes the explorer with a…\" ;\n    dct:description \"Where the toolchain provides a command that composes the explorer with a specification, that command must resolve a copy of the explorer locally and must not require network access.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"43\"^^xsd:integer ;\n    specl:priority \"MUST\" ;\n    specl:acceptanceCriterion \"Given a deployment with no network egress and specl installed from a local distribution, when the compose command is run, then it resolves the explorer without a fetch and completes.\" ;\n    specl:rationale \"This is the obligation R1.3 previously met by accident. A command that assembles the explorer in an air-gapped deployment needs the file present; whether it arrives in the distribution or beside it is a packaging choice, and this states the property that choice has to preserve.\" .\n\nspec:R2.1 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The explorer must accept a `spec.ttl` file via a file input control and via…\" ;\n    dct:description \"The explorer must accept a `spec.ttl` file via a file input control and via drag-and-drop onto the window.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"50\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given a spec.ttl, when it is chosen through the file control and, separately, dropped onto the window, then both paths load the same graph and produce the same item list.\" .\n\nspec:R2.2 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"It must include a minimal Turtle parser sufficient for the specl output format…\" ;\n    dct:description \"It must include a minimal Turtle parser sufficient for the specl output format (subject + indented predicates, `@prefix` declarations, `\\\"...\\\"` and `\\\"\\\"\\\"...\\\"\\\"\\\"` string literals, IRIs with `spec:` and `specl:` prefixes).\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"53\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given each form the current graph contract emits, being prefixed and absolute subjects, single- and triple-quoted literals, typed literals and derived list nodes, when a file containing all of them is loaded, then every subject and every property value is represented.\" .\n\nspec:R2.3 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The parser must extract every item class the graph contract declares, currently…\" ;\n    dct:description \"The parser must extract every item class the graph contract declares, currently Specification, Requirement, UserStory, OpenIssue, DecisionRecord, DesignNote, Comment, AcceptanceQuery, Persona, Agent and SourceDocument, with their full property sets, and must report any class it encounters that it does not represent per R2.9.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"56\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given a file containing an individual of every class the contract declares, when it is loaded, then every individual is represented with its full property set, and any class the explorer does not represent is reported under R2.9.\" .\n\nspec:R2.4 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"A parse failure on an individual statement must not stop the tool\" ;\n    dct:description \"A parse failure on an individual statement must not stop the tool. The statement is skipped and reported in the interface under R2.9.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"59\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given a file containing a malformed statement, when it is loaded, then the remaining statements load, the tool remains operable, and the malformed statement is reported in the interface rather than only to the console.\" .\n\nspec:R2.5 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The raw file text must be retained in memory so the Raw Turtle tab can display…\" ;\n    dct:description \"The raw file text must be retained in memory so the Raw Turtle tab can display it exactly as loaded.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"62\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given a loaded file, when the whole-file raw view is displayed, then the text shown is identical to the file as read, including whitespace and prefix declarations.\" .\n\nspec:R2.6 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"A predicate appearing more than once on a subject must be retained as an…\" ;\n    dct:description \"A predicate appearing more than once on a subject must be retained as an ordered collection of all its values, and every value must be rendered.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"65\"^^xsd:integer ;\n    specl:priority \"MUST\" ;\n    specl:acceptanceCriterion \"Given an item carrying three values for one predicate, when its detail view is opened, then three values are shown for that property.\" ;\n    specl:rationale \"The translator emits one triple per annotation value. Assigning each value over the last discards content the reader has no way to know was there, and it does so in the properties the maturity figure is computed from.\" .\n\nspec:R2.7 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Values held as an rdf:List of derived cons cells must be resolved and rendered…\" ;\n    dct:description \"Values held as an rdf:List of derived cons cells must be resolved and rendered in list order as part of the owning item.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"70\"^^xsd:integer ;\n    specl:priority \"MUST\" ;\n    specl:acceptanceCriterion \"Given an item carrying specl:detail, when its detail view is opened, then every rdf:first value in the list is shown in order under the item that owns the list.\" ;\n    specl:rationale \"Sub-bullets carry the substance of any item whose top line is a heading. A viewer that drops them renders such an item as an empty label.\" .\n\nspec:R2.8 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Properties must be keyed by the full IRI the prefix resolves to, not by the…\" ;\n    dct:description \"Properties must be keyed by the full IRI the prefix resolves to, not by the local name of the term.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"75\"^^xsd:integer ;\n    specl:priority \"MUST\" ;\n    specl:acceptanceCriterion \"Given two terms from different namespaces sharing a local name, when both are present on one subject, then both are retained and each is attributed to its namespace.\" ;\n    specl:rationale \"Keying by local name makes a namespace collision resolve silently to whichever term was parsed last. No collision exists under the current contract, which is the reason to fix the mechanism before one does.\" .\n\nspec:R2.9 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Any statement, class or property the parser cannot represent must be reported…\" ;\n    dct:description \"Any statement, class or property the parser cannot represent must be reported in the interface with a count and the subjects concerned, and must not be discarded silently.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"80\"^^xsd:integer ;\n    specl:priority \"MUST\" ;\n    specl:acceptanceCriterion \"Given a file containing statements the parser does not recognise, when it is loaded, then the interface reports how many were not represented and which subjects they belong to.\" ;\n    specl:rationale \"A viewer that quietly renders a subset of a file teaches the reader that what is on screen is the file. Reporting the shortfall costs one line of interface and is the difference between an incomplete view and a misleading one.\" .\n\nspec:R2.10 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The graph contract version declared by dct:conformsTo must be read and…\" ;\n    dct:description \"The graph contract version declared by dct:conformsTo must be read and reported, and a contract the explorer does not recognise must be stated as unrecognised before the content is rendered.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"85\"^^xsd:integer ;\n    specl:priority \"MUST\" ;\n    specl:acceptanceCriterion \"Given a file declaring a contract version the explorer does not implement, when it is loaded, then the declared version is displayed and the rendering is marked as possibly incomplete.\" ;\n    specl:rationale \"The contract version exists so that a consumer can tell whether it understands what it is holding. A consumer that ignores it converts a detectable mismatch into a silent misreading.\" .\n\nspec:R3.1 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"A fixed header shows spec title, version, status badge, and a maturity progress…\" ;\n    dct:description \"A fixed header shows spec title, version, status badge, and a maturity progress bar.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"92\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given a loaded specification, when the header renders, then title, version, status and the maturity figure of R5.6 are all present.\" .\n\nspec:R3.2 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"A left sidebar (approximately 320 px wide) contains the file input, a live text…\" ;\n    dct:description \"A left sidebar (approximately 320 px wide) contains the file input, a live text filter, and the grouped item list.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"95\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given a viewport at least 1000 px wide, when the interface renders, then the sidebar holds the file control, the filter and the grouped item list, and the main panel occupies the remaining width.\" .\n\nspec:R3.3 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"A main panel to the right of the sidebar contains exactly two tabs, Detail and…\" ;\n    dct:description \"A main panel to the right of the sidebar contains exactly two tabs, Detail and Raw Turtle, both scoped to the current selection. The tab set does not vary with what is selected.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"98\"^^xsd:integer ;\n    specl:priority \"MUST\" ;\n    specl:acceptanceCriterion \"Given any selection including the specification, when the tab strip is inspected, then it offers the same set of tabs as for every other selection and every tab in it addresses the selected item.\" ;\n    specl:rationale \"A tab strip whose membership changes with selection costs the reader more attention than a constant third tab would. Making the specification selectable removes the need for a variable tab set rather than creating one.\" .\n\nspec:R3.4 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The layout must use CSS Grid or Flexbox so the sidebar and main panel scroll…\" ;\n    dct:description \"The layout must use CSS Grid or Flexbox so the sidebar and main panel scroll independently.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"103\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given content longer than the viewport in both regions, when one region is scrolled to its end, then the scroll position of the other is unchanged.\" .\n\nspec:R3.5 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"A dark theme is the default\" ;\n    dct:description \"A dark theme is the default. Color tokens must be declared as CSS custom properties at `:root` so a future light theme can be added without rewriting the stylesheet.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"106\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given the stylesheet, when it is inspected, then every colour in use resolves to a custom property declared at :root and no colour literal appears outside that block.\" .\n\nspec:R3.7 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The explorer must offer a light and a dark presentation, defaulting to dark…\" ;\n    dct:description \"The explorer must offer a light and a dark presentation, defaulting to dark, with a control to switch and an option to follow the system setting. Each presentation must be a single block of token declarations, and no rule outside those blocks may depend on which is applied.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"109\"^^xsd:integer ;\n    specl:priority \"SHOULD\" ;\n    specl:acceptanceCriterion \"Given the light presentation, when any view is rendered, then every element is legible and no colour literal outside the token blocks is in use.\" ;\n    specl:acceptanceCriterion \"Given the control, when it is operated, then the presentation changes between dark, light and following the system, and the current choice is stated.\" ;\n    specl:rationale \"Reading a specification on paper-white and reading it at night are different tasks. R3.5 already required every colour to be a token, which makes a second presentation one block rather than a second stylesheet.\" .\n\nspec:R3.6 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Item type and item status must be conveyed through a channel other than colour…\" ;\n    dct:description \"Item type and item status must be conveyed through a channel other than colour alone wherever they are displayed.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"115\"^^xsd:integer ;\n    specl:priority \"MUST\" ;\n    specl:acceptanceCriterion \"Given the interface rendered in greyscale, when a list containing several item types is displayed, then the type of each item remains distinguishable.\" ;\n    specl:rationale \"The type indicator is currently a coloured dot and nothing else, which conveys nothing in greyscale, in print, or to a reader who does not distinguish those hues. The specification already requires the colours to be themeable tokens, which is the wrong half of the problem to have solved.\" .\n\nspec:R4.1 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Items are grouped by type, with group headers showing the type label and count…\" ;\n    dct:description \"Items are grouped by type, with group headers showing the type label and count (e.g., \\\"Requirements (8)\\\").\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"122\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given a specification containing more than one item class, when the list renders, then each class appears under a header carrying its label and the count of items shown beneath it.\" .\n\nspec:R4.2 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Each item row shows its short identifier and its title per R4.8, falling back…\" ;\n    dct:description \"Each item row shows its short identifier and its title per R4.8, falling back to a truncated preview of the description only where the item carries no title.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"125\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given an item carrying a title and an item carrying none, when both rows render, then the first shows its identifier and title and the second shows its identifier and a description preview.\" .\n\nspec:R4.3 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Each item class carries a distinct indicator combining a glyph or letterform…\" ;\n    dct:description \"Each item class carries a distinct indicator combining a glyph or letterform with colour, per R3.6. Colours are declared as CSS variables so they can be themed, and the indicator remains legible when they are not applied.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"128\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given the item list rendered with no colour applied, when it is read, then the class of every row remains identifiable from its indicator.\" .\n\nspec:R4.4 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Items must sort naturally within their group, so `R1.10` follows `R1.9`, not…\" ;\n    dct:description \"Items must sort naturally within their group, so `R1.10` follows `R1.9`, not `R1.1`.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"131\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given items identified R1.1, R1.9 and R1.10, when their group renders, then they appear in that order.\" .\n\nspec:R4.5 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The filter input must match against item identifier, displayed label…\" ;\n    dct:description \"The filter input must match against item identifier, displayed label, description, and any SKOS label the item carries, case-insensitive, updating the list on every keystroke. Where an item matches on text its row does not show, the matching text must be shown with it.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"134\"^^xsd:integer ;\n    specl:priority \"MUST\" ;\n    specl:acceptanceCriterion \"Given a filter term, when it is typed, then the list updates on each keystroke and contains every item whose identifier, displayed label per R4.8, description, or any SKOS label it carries contains the term, matched without regard to case.\" ;\n    specl:acceptanceCriterion \"Given an item carrying an alternative label that differs from its displayed label, when that alternative label is entered as a filter term, then the item is listed.\" ;\n    specl:acceptanceCriterion \"Given an item listed because of a match on text its row does not display, when the row renders, then the text that caused the match is shown with it.\" ;\n    specl:rationale \"The label is what the reader is looking at under R4.8, so a filter that does not match it fails against the only text on most rows. Matching labels the row does not display then creates the opposite problem, a result the reader cannot account for, which is the condition D3 excludes; showing the matched text is what keeps the result set explicable.\" .\n\nspec:R4.6 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Clicking a sidebar item selects it, highlights the row, and updates the main…\" ;\n    dct:description \"Clicking a sidebar item selects it, highlights the row, and updates the main panel. The selection persists across tab changes, and the specification row is selected when a file finishes loading.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"141\"^^xsd:integer ;\n    specl:priority \"MUST\" ;\n    specl:acceptanceCriterion \"Given a loaded file, when the interface first paints, then the specification row is selected and the Detail tab shows its content, and when another row is selected and the tab is changed, then the selection is unchanged.\" ;\n    specl:rationale \"Defaulting to the specification removes the empty-detail state that currently follows a successful load, in which the tool asks the reader to make a selection immediately after being given a file.\" .\n\nspec:R4.7 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The specification must appear as a selectable row in a pinned group at the head…\" ;\n    dct:description \"The specification must appear as a selectable row in a pinned group at the head of the item list, above the type groups and exempt from the text filter.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"146\"^^xsd:integer ;\n    specl:priority \"MUST\" ;\n    specl:acceptanceCriterion \"Given a loaded file, when the item list is rendered, then a specification row is present at the head of the list, and when a filter term matching no part of the specification is entered, then the row remains present.\" ;\n    specl:rationale \"The specification is a node of the graph like every other node. Presenting it as a tab rather than an item was the only place in the interface where that was not true, and it is the source of the scope confusion the tab arrangement produced.\" .\n\nspec:R4.8 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Where an item declares dct:title, the title must be used as its display label…\" ;\n    dct:description \"Where an item declares dct:title, the title must be used as its display label, with the identifier shown alongside and the full IRI reachable from the item.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"151\"^^xsd:integer ;\n    specl:priority \"MUST\" ;\n    specl:acceptanceCriterion \"Given an item carrying a title, when it is shown in the list and in the detail view, then the title is the label displayed and the identifier and IRI are both obtainable.\" ;\n    specl:rationale \"Titles are emitted on every item for this purpose. Displaying a truncation of the description in their place discards a field the format supplies and produces a worse label than the one available.\" .\n\nspec:R4.9 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Changing the selection must not rebuild the item list, and keyboard focus must…\" ;\n    dct:description \"Changing the selection must not rebuild the item list, and keyboard focus must survive selection.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"156\"^^xsd:integer ;\n    specl:priority \"MUST\" ;\n    specl:acceptanceCriterion \"Given focus on an item row, when that row is selected by keyboard and an arrow key is then pressed, then focus moves to the adjacent row.\" ;\n    specl:rationale \"Rebuilding the list on selection destroys the focused element, so the arrow-key navigation the specification requires stops working at the first keyboard selection.\" .\n\nspec:R5.1 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The header must display the spec's `dct:title`, `dct:hasVersion`, and…\" ;\n    dct:description \"The header must display the spec's `dct:title`, `dct:hasVersion`, and `specl:status` properties.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"163\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given a loaded specification, when the header renders, then dct:title, dct:hasVersion and specl:status are displayed as they appear in the graph.\" .\n\nspec:R5.2 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"A maturity figure must be reported under the definition R5.6 establishes, over…\" ;\n    dct:description \"A maturity figure must be reported under the definition R5.6 establishes, over the population that definition names.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"166\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given a loaded specification, when the maturity figure is displayed, then it equals the figure specl-validate score reports for the same graph, or is labelled as an estimate under R5.6.\" .\n\nspec:R5.3 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The score must render as both a numeric percentage and a horizontal progress bar\" ;\n    dct:description \"The score must render as both a numeric percentage and a horizontal progress bar.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"169\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given a maturity figure, when the header renders, then the figure appears as a percentage and as a bar whose filled proportion equals it.\" .\n\nspec:R5.4 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The bar color must shift: red below 50%, amber from 50% to 84%, green at 85%…\" ;\n    dct:description \"The bar color must shift: red below 50%, amber from 50% to 84%, green at 85% and above. Thresholds must be declared as constants at the top of the script for easy tuning.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"172\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given figures of 49, 50, 84 and 85 percent, when each is rendered, then the bar is red, amber, amber and green respectively, and the thresholds are declared as named constants in one place.\" .\n\nspec:R5.5 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"If the loaded spec has zero requirements, the maturity score displays as \\\"—\\\"…\" ;\n    dct:description \"If the loaded spec has zero requirements, the maturity score displays as \\\"—\\\" and the bar is empty, not zero.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"175\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given a specification whose population for the figure is empty, when the header renders, then the figure is reported as undefined rather than as zero and the bar is unfilled.\" .\n\nspec:R5.6 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The explorer must not compute a maturity figure under a definition of its own\" ;\n    dct:description \"The explorer must not compute a maturity figure under a definition of its own. Where a score produced by specl-validate accompanies the file, that figure must be displayed. Where none accompanies it, the explorer must compute the published definition, or must label the figure as an unverified estimate and state the definition it used.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"178\"^^xsd:integer ;\n    specl:priority \"MUST\" ;\n    specl:acceptanceCriterion \"Given a file accompanied by a score report, when the header is rendered, then the figure displayed equals the figure the report carries; and given a file with no report, when the header is rendered, then the figure is labelled as an estimate and its definition is obtainable.\" ;\n    specl:rationale \"The explorer currently reports zero for a specification the CLI scores at eight percent, using a different population, a different property set and no weighting. Two authoritative-looking figures for one artifact is worse than one figure with a stated limitation, and the reader has no way to discover which is canonical.\" .\n\nspec:R5.7 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The definition of any figure the explorer displays must be resolvable from the…\" ;\n    dct:description \"The definition of any figure the explorer displays must be resolvable from the point at which the figure appears, stating what is counted, over what population, and with what exclusions.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"183\"^^xsd:integer ;\n    specl:priority \"MUST\" ;\n    specl:acceptanceCriterion \"Given any displayed figure, when its definition is requested, then the count, the population and the exclusions are returned.\" .\n\nspec:R5.8 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Every aggregate figure must make the population it counts obtainable, by…\" ;\n    dct:description \"Every aggregate figure must make the population it counts obtainable, by opening that population in the item list or by reporting its members.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"187\"^^xsd:integer ;\n    specl:priority \"MUST\" ;\n    specl:acceptanceCriterion \"Given any count or ratio displayed by the explorer, when its population is requested, then every item the figure counted is obtained, whether by the item list being narrowed to them or by their being listed.\" ;\n    specl:rationale \"A figure that cannot be opened is a claim the reader has to take or leave. The per-type chips and the maturity ratio are both currently dead ends, and both already know their own membership.\" .\n\nspec:R5.9 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Where a figure reports a shortfall, the items contributing to that shortfall…\" ;\n    dct:description \"Where a figure reports a shortfall, the items contributing to that shortfall must be obtainable in order of contribution.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"192\"^^xsd:integer ;\n    specl:priority \"SHOULD\" ;\n    specl:acceptanceCriterion \"Given a maturity figure below one hundred percent, when its contributors are requested, then the items reducing it are listed with the property each is missing, ordered by contribution.\" ;\n    specl:rationale \"The figure states that work remains. Ordering the contributors states where to start, which is the only action the figure supports.\" .\n\nspec:R6.1 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"When an item is selected, the Detail tab heads the view with the item's class…\" ;\n    dct:description \"When an item is selected, the Detail tab heads the view with the item's class and identifier, shows its IRI, and lists every property it carries as a definition list. A title the description already contains is not repeated as a row.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"199\"^^xsd:integer ;\n    specl:priority \"MUST\" ;\n    specl:acceptanceCriterion \"Given a selected item, when the detail tab renders, then the heading is the item's class followed by its identifier, the IRI is shown, and every property the item carries appears once.\" ;\n    specl:rationale \"The heading was the title, which for most items is a truncation of the description that then appears in full immediately below it. Naming the class and the identifier says what the reader is looking at, and removes the separate line that used to repeat both.\" .\n\nspec:R6.2 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Type-specific fields must render in a sensible order\" ;\n    dct:description \"Type-specific fields must render in a sensible order:\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"204\"^^xsd:integer ;\n    specl:detail spec:R6.2-detail-1 ;\n    specl:acceptanceCriterion \"Given a selected item of each class, when the detail view renders, then the properties appear in the order declared for that class, and a property outside that order appears after it rather than being omitted.\" .\n\nspec:R6.2-detail-1\n    rdf:first \"Requirement: description, priority, acceptance criterion, verified by, constrains\" ;\n    rdf:rest  spec:R6.2-detail-2 .\n\nspec:R6.2-detail-2\n    rdf:first \"UserStory: description, as a, I want, so that, acceptance criterion\" ;\n    rdf:rest  spec:R6.2-detail-3 .\n\nspec:R6.2-detail-3\n    rdf:first \"OpenIssue: description, recommendation, owner, resolution status\" ;\n    rdf:rest  spec:R6.2-detail-4 .\n\nspec:R6.2-detail-4\n    rdf:first \"DecisionRecord: description, status, rationale, affects\" ;\n    rdf:rest  rdf:nil .\n\nspec:R6.3 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Properties that exist in the expected set but are absent in the data must…\" ;\n    dct:description \"Properties that exist in the expected set but are absent in the data must render as an italic \\\"not set\\\" placeholder in a muted warning color, so gaps are visually obvious.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"211\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given an item whose class accepts a property it does not carry, when the detail view renders, then that property is shown with an absence marker distinguishable from an empty value.\" .\n\nspec:R6.4 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"For requirements, the tab must show a readiness chip derived from the same…\" ;\n    dct:description \"For requirements, the tab must show a readiness chip derived from the same definition as the header figure per R5.6, and the chip must state which definition it used.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"214\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given a requirement, when its readiness chip renders, then the chip states the definition it was derived from and that definition is the one the header figure used.\" .\n\nspec:R6.5 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Long text values must wrap cleanly and remain selectable for copy\" ;\n    dct:description \"Long text values must wrap cleanly and remain selectable for copy.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"217\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given a property value wider than the panel, when it renders, then it wraps within the panel, is selectable as continuous text, and copies without inserted line breaks.\" .\n\nspec:R6.6 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"A property whose value is a reference to another item in the graph must render…\" ;\n    dct:description \"A property whose value is a reference to another item in the graph must render as a control that selects the referenced item, and a reference that resolves to nothing must be marked as unresolved rather than rendered as text.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"220\"^^xsd:integer ;\n    specl:priority \"MUST\" ;\n    specl:acceptanceCriterion \"Given an item carrying a reference-valued property, when the value is selected, then the referenced item becomes the current selection; and given a reference with no corresponding subject in the loaded graph, when the item is displayed, then the value is marked unresolved.\" ;\n    specl:rationale \"Reference-valued properties are IRIs under the current contract. Rendering them as inert text presents a graph as a set of disconnected records and leaves the reader without the one capability the format exists to provide.\" .\n\nspec:R6.7 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"An item's detail view must list the items that reference it, grouped by the…\" ;\n    dct:description \"An item's detail view must list the items that reference it, grouped by the property through which the reference is made.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"225\"^^xsd:integer ;\n    specl:priority \"SHOULD\" ;\n    specl:acceptanceCriterion \"Given an item referenced by two others, when its detail view is opened, then both referring items are listed under the property that names it.\" ;\n    specl:rationale \"Forward references answer what an item depends on. The question asked more often of a requirement is what depends on it, and the graph already contains the answer.\" .\n\nspec:R6.8 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"An item's detail view must state the source document and line it was derived…\" ;\n    dct:description \"An item's detail view must state the source document and line it was derived from.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"230\"^^xsd:integer ;\n    specl:priority \"SHOULD\" ;\n    specl:acceptanceCriterion \"Given an item carrying prov:wasDerivedFrom and specl:sourceLine, when its detail view is opened, then the source document identifier and the line number are shown.\" ;\n    specl:rationale \"The reader who finds a defect in the explorer fixes it in the markdown. Carrying the line number removes a search from every such correction.\" .\n\nspec:R7.1 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"When an item is selected, the tab shows that item's Turtle statement block…\" ;\n    dct:description \"When an item is selected, the tab shows that item's Turtle statement block, extracted from the raw text by locating the subject IRI and taking characters through the next statement terminator (`\\\\n.` or ` .\\\\n`).\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"237\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given a selected item, when the raw tab renders, then the block shown begins at that item's subject, ends at its terminator, and includes any derived nodes the item owns.\" .\n\nspec:R7.2 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Withdrawn\" ;\n    dct:description \"Withdrawn. Superseded by R7.6; the no-selection state no longer occurs.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"240\"^^xsd:integer ;\n    specl:itemStatus \"withdrawn\" .\n\nspec:R7.3 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The displayed Turtle must be syntax-highlighted: distinct colors for prefixes…\" ;\n    dct:description \"The displayed Turtle must be syntax-highlighted: distinct colors for prefixes, IRIs, predicates, string literals, and comments.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"243\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given a raw block containing a prefix declaration, an IRI, a predicate, a string literal and a comment, when it renders, then each is visually distinguished and the distinction does not rest on colour alone.\" .\n\nspec:R7.4 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Highlighting must be implemented with a small inline function (regex-based is…\" ;\n    dct:description \"Highlighting must be implemented with a small inline function (regex-based is acceptable); no external highlighter library.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"246\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given the implementation, when it is inventoried, then highlighting is performed by a function within the file and no highlighting library is loaded.\" .\n\nspec:R7.5 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The Turtle block must render in a monospace font and allow horizontal scrolling…\" ;\n    dct:description \"The Turtle block must render in a monospace font and allow horizontal scrolling for long lines.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"249\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given a raw block containing a line wider than the panel, when it renders, then the line is not wrapped and the block scrolls horizontally.\" .\n\nspec:R7.6 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The Raw Turtle tab must offer the whole file as an alternative to the selected…\" ;\n    dct:description \"The Raw Turtle tab must offer the whole file as an alternative to the selected item's statement block, and must state which of the two is displayed.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"252\"^^xsd:integer ;\n    specl:priority \"MUST\" ;\n    specl:acceptanceCriterion \"Given a selected item, when the whole-file view is chosen, then the complete file as loaded is displayed and the view identifies itself as the whole file rather than the item.\" ;\n    specl:rationale \"The whole-file view was previously reached by having no selection, which the default selection in R4.6 removes. The view is worth keeping and now needs a control of its own.\" .\n\nspec:R7.7 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The Raw Turtle tab must number every line with its line in the loaded file, in…\" ;\n    dct:description \"The Raw Turtle tab must number every line with its line in the loaded file, in both the item view and the whole-file view, and must mark a break where an item's statements are not contiguous. A number must not be included when the block is copied.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"257\"^^xsd:integer ;\n    specl:priority \"SHOULD\" ;\n    specl:acceptanceCriterion \"Given an item whose statements do not begin at the start of the file, when its block is displayed, then the first number is that statement's line in the file, and where the block skips lines the break is marked.\" ;\n    specl:acceptanceCriterion \"Given a displayed block, when it is selected and copied, then the copied text is the Turtle without the numbers.\" ;\n    specl:rationale \"A block shown without numbers cannot be pointed at. Numbering it from one would give a reader a number no other tool would agree with, so the numbers are the file's; provenance under R6.8 names the markdown line, and this names the graph line.\" .\n\nspec:R8.1 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The specification view shows total item count, per-class counts and the…\" ;\n    dct:description \"The specification view shows total item count, per-class counts and the readiness ratio, each of which makes the items it counts obtainable per R5.8.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"265\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given a loaded specification, when the specification view renders, then the total item count, a count per class and the readiness ratio are all shown, and the items behind each are obtainable under R5.8.\" .\n\nspec:R8.2 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Shows the spec's `specl:intent` and `specl:purpose` prose in full\" ;\n    dct:description \"Shows the spec's `specl:intent` and `specl:purpose` prose in full.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"268\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given a specification carrying intent and purpose, when the specification view renders, then both are shown in full and neither is truncated.\" .\n\nspec:R8.3 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Shows a per-type breakdown (how many requirements, stories, open issues, etc.)\" ;\n    dct:description \"Shows a per-type breakdown (how many requirements, stories, open issues, etc.).\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"271\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given a specification containing several classes, when the specification view renders, then a count is shown per class and the items behind each count are obtainable under R5.8.\" .\n\nspec:R8.4 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Withdrawn\" ;\n    dct:description \"Withdrawn. The specification view is reached by selecting the specification row.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"274\"^^xsd:integer ;\n    specl:itemStatus \"withdrawn\" .\n\nspec:R9.1 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Before any file is loaded, the main panel shows a centered \\\"Drop a spec.ttl…\" ;\n    dct:description \"Before any file is loaded, the main panel shows a centered \\\"Drop a spec.ttl file to begin\\\" message.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"279\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given no loaded file, when the interface renders, then it states what to provide, how to produce it, and offers the embedded example of R9.4.\" .\n\nspec:R9.2 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"If the dropped file fails to parse (no Specification individual found), show an…\" ;\n    dct:description \"If the dropped file fails to parse (no Specification individual found), show an error message explaining the expected format and linking to the specl README convention.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"282\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given a file containing no specl:Specification, when it is loaded, then the interface states what was expected, what was found instead, and how a conforming file is produced.\" .\n\nspec:R9.3 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"If the file is empty or contains no recognized items, show \\\"No items found in…\" ;\n    dct:description \"If the file is empty or contains no recognized items, show \\\"No items found in this file.\\\"\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"285\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given a file containing a specification and no items, when it is loaded, then the specification remains selectable and the item list states that the file contains no items.\" .\n\nspec:R9.4 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"An example specification must be embedded in the file and loadable without a…\" ;\n    dct:description \"An example specification must be embedded in the file and loadable without a file of the reader's own. The example is this specification's own emitted graph, and the embedded copy must state the version it was generated from.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"288\"^^xsd:integer ;\n    specl:priority \"MUST\" ;\n    specl:acceptanceCriterion \"Given no loaded file, when the example is chosen, then this specification's own graph is loaded, every capability operates on it as it would on a supplied file, and the version the embedded copy was generated from is stated.\" ;\n    specl:acceptanceCriterion \"Given a build, when the embedded example is compared with the graph emitted from this specification, then they are identical, and when they are not, the build fails.\" ;\n    specl:rationale \"The tool that reads specl specifications should open on the specification that defines it. That makes the first encounter a demonstration rather than an instruction, and it puts this specification's own maturity figure in front of every new reader. The embedded copy is a self-reference and goes stale silently, which is why the build guards it.\" .\n\nspec:R10.1 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"First paint after file drop must complete in under 200 ms for specs up to 500…\" ;\n    dct:description \"First paint after file drop must complete in under 200 ms for specs up to 500 items on mid-tier hardware.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"296\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given a specification of 500 items on mid-tier hardware, when the file is read, then the first rendered view appears within 200 ms.\" .\n\nspec:R10.2 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"No data leaves the browser\" ;\n    dct:description \"No data leaves the browser. No telemetry, no network requests, no external resource loads.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"299\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given a full session covering load, filter, selection, navigation, reference and export, when network activity is observed throughout, then no request leaves the browser.\" .\n\nspec:R10.3 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The tool must be keyboard accessible: tab to the file input, filter, and…\" ;\n    dct:description \"The tool must be keyboard accessible: tab to the file input, filter, and sidebar items; arrow keys to navigate the item list.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"302\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given keyboard input alone, when the tool is operated from load through selection, tab change, reference and export, then every control is reachable and the focused element is visible at every step.\" .\n\nspec:R10.4 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Must function offline\" ;\n    dct:description \"Must function offline. Opening the HTML file from a USB drive on an air-gapped machine is a supported use case.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"305\"^^xsd:integer ;\n    specl:acceptanceCriterion \"Given an air-gapped machine with no specl installation, when the file is opened from removable media, then every capability either functions or states the dependency it lacks.\" .\n\nspec:R11.1 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The current selection and tab must be encoded in the document fragment, and…\" ;\n    dct:description \"The current selection and tab must be encoded in the document fragment, and opening a fragment must restore that selection and tab against the same file.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"310\"^^xsd:integer ;\n    specl:priority \"SHOULD\" ;\n    specl:acceptanceCriterion \"Given a selected item and tab, when the address is copied and opened again against the same file, then the same item and tab are restored.\" ;\n    specl:rationale \"A reviewer citing a requirement currently has to describe where to click. Fragment addressing is local to the document and does not weaken the offline guarantee.\" .\n\nspec:R11.2 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"Visited selections must be navigable backward and forward\" ;\n    dct:description \"Visited selections must be navigable backward and forward.\" ;\n    prov:wasDerivedFrom spec:source-e9e453bf ;\n    specl:sourceLine \"315\"^^xsd:integer ;\n    specl:priority \"SHOULD\" ;\n    specl:acceptanceCriterion \"Given a sequence of selections, when backward navigation is invoked, then the prior selection and tab are restored.\" ;\n    specl:rationale \"Following a reference under R6.6 is only useful if returning from it is one action.\" .\n\nspec:R12.1 a specl:Requirement ;\n    specl:partOf <https://w3id.org/specl/explorer/spec> ;\n    dct:title \"The explorer must accept a validation report produced by specl-validate…\" ;\n    dct:description \"The explorer must accept a validation report produced by specl-validate alongside
