name: pages

# The trigger decides when the site is rebuilt. It never decides what goes
# where: the root is always built from main and dev reaches only /preview/.
# Pages replaces the whole site on every deploy, and the root is where the w3id
# identifiers land, so a run triggered by dev must not be able to serve dev's
# vocabulary at https://w3id.org/specl/ns.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # A superseded preview build is cheap. A cancelled deploy of the vocabulary
  # and shapes is not, and a push to dev must not be able to cancel one.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Explicitly main rather than the triggering ref. Without this the root
      # content is decided by whichever branch fired the run, which is what
      # makes adding a second trigger dangerous.
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Install specl
        # The badges are generated here, so the package is needed rather than
        # rdflib alone.
        run: pip install -e .

      - name: Build pages site
        run: |
          mkdir -p _site
          cp src/specl/core.ttl _site/ns.ttl
          # The w3id rules negotiate application/ld+json to ns.jsonld. Without
          # this step that redirect lands on a 404.
          python3 -c "import rdflib; rdflib.Graph().parse('src/specl/core.ttl').serialize('_site/ns.jsonld', format='json-ld')"
          cp src/specl/shapes.ttl _site/shapes.ttl
          # Versioned copies, addressed by graph contract rather than by
          # release. UR17 commits these locations and they must stay fetchable.
          mkdir -p _site/ns _site/shapes
          # Contract 1 copies stay fetchable: UR17 commits that, and graphs in
          # the wild still declare it. Copied from published/, which holds them
          # as frozen files. Reading them from a git tag needed the tag to exist
          # and the checkout to have fetched it, and neither is guaranteed.
          cp published/ns-1.ttl _site/ns/1.ttl
          cp published/shapes-1.ttl _site/shapes/1.ttl
          cp src/specl/core.ttl _site/ns/2.ttl
          cp src/specl/shapes.ttl _site/shapes/2.ttl
          cp src/specl/explorer.html _site/explorer.html
          cp static/index.html _site/index.html
          # Generated here rather than copied from the tree, so the badge
          # always describes the commit being published rather than whenever it
          # was last committed.
          mkdir -p _site/badges
          for spec in specs/*/; do
            name=$(basename "$spec")
            specl-translate "$spec/spec.md" "/tmp/$name.ttl"
            specl-validate badge "/tmp/$name.ttl" --out "_site/badges/$name.svg"
          done
          echo "Site contents:"
          ls -la _site/

      # Everything below builds /preview/ from dev. Both steps continue on
      # error: the identifier surface must publish whatever state dev is in, so
      # a broken working branch costs the preview and nothing else.
      - name: Check out dev for the preview
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          ref: dev
          path: dev-src

      - name: Build the dev preview
        continue-on-error: true
        run: |
          set -e
          if [ ! -f dev-src/src/specl/explorer.html ]; then
            echo "no explorer on dev; skipping the preview"
            exit 0
          fi
          mkdir -p _site/preview
          # Copied, not rebuilt. dev carries the built file as package data, and
          # rebuilding here would need Node and would produce a different file
          # from the one dev actually ships.
          cp dev-src/src/specl/explorer.html _site/preview/explorer.html
          sha=$(git -C dev-src rev-parse --short HEAD)
          built=$(date -u +"%Y-%m-%d %H:%M UTC")
          cat > _site/preview/index.html <<HTML
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="robots" content="noindex">
          <title>specl preview (unreleased)</title>
          <style>
            body { font-family: system-ui, sans-serif; max-width: 720px; margin: 3em auto; padding: 0 1.5em; color: #222; line-height: 1.6; }
            .warn { border-left: 4px solid #b35900; background: #fff6ec; padding: 1em 1.2em; }
            code { background: #f4f4f4; padding: 2px 6px; border-radius: 3px; font-size: 0.9em; }
          </style>
          </head>
          <body>
          <h1>specl preview</h1>
          <div class="warn">
            <p><strong>This is unreleased work.</strong> It is built from the
            <code>dev</code> branch at <code>$sha</code>, $built, and it changes
            without notice or disappears entirely.</p>
            <p>It is not a release channel. Nothing here is what a
            <code>w3id.org/specl</code> identifier resolves to, and nothing here
            should be cited, pinned or linked from anything durable.</p>
          </div>
          <h2>What is here</h2>
          <p><a href="explorer.html">Spec explorer</a>, opening on its own
          specification. Drop any generated <code>spec.ttl</code> on it to read
          that instead.</p>
          <h2>The released version</h2>
          <p><a href="../explorer.html">The explorer as released</a>, and
          <a href="../">the vocabulary site</a>. Those are the ones to link to.</p>
          </body>
          </html>
          HTML
          echo "Preview contents:"
          ls -la _site/preview/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
